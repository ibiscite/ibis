# Dependency policy, enforced in CI by `cargo deny check`.
# Every dependency must be AGPL-compatible, free of known vulnerabilities,
# and come from crates.io.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is unmaintained (not vulnerable). It comes in through the `biblatex`
    # parser. Revisit when biblatex drops it or a replacement parser is chosen.
    { id = "RUSTSEC-2024-0436", reason = "transitive via biblatex; unmaintained, no known vulnerability" },
    # `proc-macro-error` is unmaintained (not vulnerable). It is a build-time
    # macro helper reached through Tauri's GTK bindings on Linux; nothing
    # from it ships in the app. Revisit when the GTK bindings drop it.
    { id = "RUSTSEC-2024-0370", reason = "build-time only, transitive via gtk-rs used by Tauri on Linux; no known vulnerability" },
    # zbus_names, zvariant and zvariant_derive were merged into zbus 6 (not
    # vulnerable). They come through tauri-plugin-single-instance, which still
    # uses zbus 5 for D-Bus on Linux. Revisit when the plugin moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "merged into zbus 6; transitive via tauri-plugin-single-instance on Linux; no known vulnerability" },
    { id = "RUSTSEC-2026-0371", reason = "merged into zbus 6; transitive via tauri-plugin-single-instance on Linux; no known vulnerability" },
    { id = "RUSTSEC-2026-0372", reason = "merged into zbus 6; transitive via tauri-plugin-single-instance on Linux; no known vulnerability" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

# ADRs 0013/0014: test-only libFuzzer; no application dependency on the fuzz package.
[[licenses.exceptions]]
name = "libfuzzer-sys"
version = "=0.4.13"
allow = ["NCSA"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
