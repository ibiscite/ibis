[package]
name = "ibis-zotero-local"
description = "Talks to Zotero's local API on this computer only"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ibis-core = { path = "../ibis-core" }
rusqlite = { version = "0.41.0", default-features = false, features = ["bundled", "hooks", "limits"] }
thiserror = "2.0.21"
serde_json = "1.0.154"
ryu-js = "1.0.3"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }
nix = { version = "0.31.3", default-features = false, features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1.6.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Globalization",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_IO"] }

# `forbid` cannot be narrowed by a module allowance. Keep the workspace's
# Clippy policy, and deny unsafe everywhere except the native Windows boundary.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
