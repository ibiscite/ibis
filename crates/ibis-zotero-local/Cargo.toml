[package]
name = "ibis-zotero-local"
description = "Talks to Zotero's local API on this computer only"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ibis-core = { path = "../ibis-core" }
rusqlite = { version = "0.41.0", default-features = false, features = ["bundled", "hooks", "limits"] }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }
nix = { version = "0.31.3", default-features = false, features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1.6.1"

[lints]
workspace = true
