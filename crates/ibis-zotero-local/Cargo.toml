[package]
name = "ibis-zotero-local"
description = "Reads Zotero on this computer: its local API, or a copy of its database while it is closed"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ibis-core = { path = "../ibis-core" }
miniz_oxide = { version = "0.8.9", features = ["with-alloc"] }
rusqlite = { version = "0.41.0", default-features = false, features = ["bundled", "hooks"] }
thiserror = "2.0.21"
serde_json = "1.0.154"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"

# Whether Zotero's data folder is on a local disk (ADR 0027).
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }
