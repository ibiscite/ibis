[package]
name = "ibis-source-endnote"
description = "EndNote libraries for Ibis, through the source adapter protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ibis-core = { path = "../ibis-core" }
# The CSL name, date and DOI rules the RIS and CSV readers use.
ibis-sources = { path = "../ibis-sources" }
# Already locked through the workspace. Text only: no entity resolver, file
# or network access exists in it.
quick-xml = "=0.42.0"
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
