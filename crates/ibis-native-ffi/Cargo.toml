[package]
name = "ibis-native-ffi"
description = "The native macOS picker adapter for ibis-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[target.'cfg(target_os = "macos")'.dependencies]
ibis-core = { path = "../ibis-core" }
ibis-native = { path = "../ibis-native" }
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std", "NSApplication", "NSEvent", "NSPasteboard", "NSResponder", "NSWindow", "objc2-core-graphics",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSString"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
panic = "deny"
unused_result_ok = "deny"
expect_used = "warn"
