[package]
name = "ibis-sources"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
schemars = "=1.2.3"
ibis-core = { path = "../ibis-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
thiserror = "2.0.21"
ibis-zotero-local = { path = "../ibis-zotero-local" }
biblatex = "0.12.0"
getrandom = "0.4.3"
notify = "8.2.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
# Already locked through the desktop: safe mount/placeholder metadata queries.
winsafe = { version = "0.0.29", default-features = false, features = ["kernel"] }

[dev-dependencies]
tempfile = "3.27.0"
# Tests only: they build Zotero databases and compare normalized text.
rusqlite = { version = "0.41.0", features = ["bundled", "hooks"] }
unicode-normalization = "0.1.26"
insta = { version = "1.49.0", features = ["json"] }
proptest = "1.12.0"

[lints]
workspace = true
