[package]
name = "ibis-sources"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# Only the CLI serves this adapter, in its own process.
endnote = ["dep:quick-xml"]

[dependencies]
schemars = "=1.2.3"
ibis-core = { path = "../ibis-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
thiserror = "2.0.21"
rusqlite = { version = "0.41.0", default-features = false, features = ["bundled", "hooks", "limits"] }
ryu-js = "1.0.3"
quick-xml = { version = "=0.42.0", optional = true }
biblatex = "0.12.0"
getrandom = "0.4.3"
notify = "8.2.0"
# Page labels are compared in NFC (decision 0036).
unicode-normalization = "0.1.26"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs", "resource", "signal", "user"] }

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1.6.1"

[target.'cfg(windows)'.dependencies]
# Already locked through the desktop: safe mount/placeholder metadata queries.
winsafe = { version = "0.0.29", default-features = false, features = ["kernel"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_IO", "Win32_Security"] }

[dev-dependencies]
tempfile = "3.27.0"
# Tests only: they build Zotero databases.
rusqlite = { version = "0.41.0", features = ["bundled", "hooks"] }
insta = { version = "1.49.0", features = ["json"] }
proptest = "1.12.0"

# Deny unsafe except in the scoped post-fork descriptor boundary and the
# native Windows boundary of closed Zotero reads (0029).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
panic = "deny"
unused_result_ok = "deny"
expect_used = "warn"
