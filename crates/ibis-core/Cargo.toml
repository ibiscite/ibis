[package]
name = "ibis-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# The manuscript and marker readers, run only in the CLI's document child (decision 0060).
documents = []

[dependencies]
schemars = "=1.2.3"
sha2 = "0.11.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
# Records must read back exactly as written: a number never comes back as a
# neighbouring f64, in a record ID or a CSL field.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
memchr = "2.8.3"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
proptest = "1.12.0"

[lints]
workspace = true
