[package]
name = "ibis-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
type-export = ["dep:specta"]
headless-csl-prototype = ["dep:rquickjs", "dep:icu_collator", "dep:icu_casemap", "dep:icu_locale_core", "dep:writeable"]

[dependencies]
biblatex = "0.12.0"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }
unicode-normalization = "0.1.26"
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"], optional = true }
icu_collator = { version = "=2.4.0", default-features = false, features = ["compiled_data"], optional = true }
icu_casemap = { version = "=2.4.0", default-features = false, features = ["compiled_data"], optional = true }
icu_locale_core = { version = "=2.4.0", default-features = false, features = ["alloc"], optional = true }
writeable = { version = "=0.6.4", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
dunce = "1.0.5"

[dev-dependencies]
tempfile = "3.27.0"
insta = { version = "1.49.0", features = ["json"] }
proptest = "1.12.0"

[lints]
workspace = true
