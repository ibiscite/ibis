[package]
name = "ibis-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
schemars = "=1.2.3"
sha2 = "0.11.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
memchr = "2.8.3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.27.0"
proptest = "1.12.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
