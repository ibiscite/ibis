[package]
name = "ibis-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
schemars = "=1.2.3"
ibis-core = { path = "../ibis-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ibis-sources = { path = "../ibis-sources" }
ibis-csl = { path = "../ibis-csl" }
# Edits to settings.json apply while Ibis runs (decision 0042).
notify = "8.2.0"
# Words every front end shows, from the one catalogue at locales/ (#1675).
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"

[dev-dependencies]
# Counts requested heap bytes for the library memory check; no unsafe code here.
stats_alloc = "0.1.10"
tempfile = "3.27.0"

[lints]
workspace = true
