[package]
name = "ibis-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
schemars = "=1.2.3"
ibis-core = { path = "../ibis-core" }
serde = { version = "1.0.229", features = ["derive"] }
# Transport parsing must not round a numeric record ID to a different f64.
serde_json = { version = "1.0.154", features = ["float_roundtrip", "raw_value"] }
indexmap = { version = "2.14.2", features = ["serde"] }
toml = "1.1.8"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
ibis-sources = { path = "../ibis-sources" }
ibis-csl = { path = "../ibis-csl" }
# Edits to settings.json apply while Ibis runs (decision 0042).
notify = "8.2.0"
# Words every front end shows, from the one catalogue at locales/ (#1675).
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
# A pack of references travels as one zip file (#1953); stored entries only.
zip = { version = "9.0.5", default-features = false }
tempfile = "3.27.0"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# Publish a finished pack directory without replacing an occupied name.
rustix = { version = "1.1.6", features = ["fs"] }

[target.'cfg(unix)'.dependencies]
# A raced FIFO must never block the settings owner while it fingerprints a file.
libc = "0.2.191"

[dev-dependencies]
# Counts requested heap bytes for the library memory check; no unsafe code here.
stats_alloc = "0.1.10"
# Document tests read in process; the engine itself only starts the child.
ibis-sources = { path = "../ibis-sources", features = ["documents"] }

[lints]
workspace = true
