[package]
name = "ibis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["string"] }
ibis-core = { path = "../ibis-core" }
ibis-engine = { path = "../ibis-engine" }
# The built-in EndNote source adapter, served as `ibis __source endnote`.
ibis-sources = { path = "../ibis-sources", features = ["endnote"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
jiff = "0.2.38"
console = { version = "0.16.6", default-features = false, features = ["std"] }
icu_properties = "2.4.0"
unicode-segmentation = "1.13.3"
# The PDF extractor's child process (decision 0055). Only `ibis` parses PDFs,
# never the desktop app: lopdf is pure Rust and forbids unsafe code.
lopdf = { version = "0.47.0", default-features = false }

[target.'cfg(unix)'.dependencies]
# The child's address-space and processor-time limits.
nix = { version = "0.31.3", default-features = false, features = ["resource"] }

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"

[lints]
workspace = true

# Also the fake source adapter it tests the engine with, so it has its own main.
[[test]]
name = "source_adapters"
harness = false
