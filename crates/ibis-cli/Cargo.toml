[package]
name = "ibis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["string"] }
ibis-core = { path = "../ibis-core" }
ibis-engine = { path = "../ibis-engine" }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
toml_edit = "0.25.17"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
ibis-sources = { path = "../ibis-sources" }

[lints]
workspace = true
