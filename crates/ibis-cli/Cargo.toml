[package]
name = "ibis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["string"] }
ibis-core = { path = "../ibis-core" }
ibis-engine = { path = "../ibis-engine" }
# The built-in EndNote source adapter, served as `ibis __source endnote`.
ibis-sources = { path = "../ibis-sources", features = ["documents", "endnote"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
jiff = "0.2.38"
console = { version = "0.16.6", default-features = false, features = ["std"] }
icu_properties = "2.4.0"
unicode-segmentation = "1.13.3"
# The PDF extractor's child process (decision 0055). Only `ibis` parses PDFs,
# never the desktop app: lopdf is pure Rust and forbids unsafe code.
lopdf = { version = "0.47.0", default-features = false }
# The XMP packet a PDF carries, read in the same child.
quick-xml = "=0.42.0"

[target.'cfg(unix)'.dependencies]
# Parser resource limits and the daemon's peer credentials and socket waits.
nix = { version = "0.31.3", default-features = false, features = ["fs", "poll", "resource", "socket", "user"] }

[target.'cfg(windows)'.dependencies]
# The daemon uses Tokio's overlapped named pipes with an explicit SID DACL.
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "sync", "time"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
# Builds and reads invented office documents in the format tests.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }

# Decision 0029 scopes Win32 calls to daemon/windows.rs.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
panic = "deny"
unused_result_ok = "deny"
expect_used = "warn"

# Also the fake source adapter it tests the engine with, so it has its own main.
[[test]]
name = "source_adapters"
harness = false
