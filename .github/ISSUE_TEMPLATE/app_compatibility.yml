name: Writing app report
description: How a copied citation pasted into a specific app, good or bad.
labels: [area:desktop]
body:
  - type: markdown
    attributes:
      value: |
        This builds the public list of writing apps in docs/compatibility.md, so reports that it worked help too. Never paste document contents; describe only what happened.
  - type: input
    id: app
    attributes:
      label: App and version
      placeholder: "Word for the web in Firefox 140, Pages 14, Obsidian 1.9, Overleaf ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ibis version
      placeholder: "Ibis X.Y.Z / Ibis Nightly X.Y.Z-nightly.YYYYMMDDHHMMSS"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system, version and (on Linux) desktop and session
      placeholder: "Windows 11 24H2 / macOS 26.1 / Fedora KDE Wayland"
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: What happened?
      options:
        - It worked as expected
        - The shortcut did not open Ibis
        - The pasted text had wrong formatting (lost italics, extra characters, doubled brackets ...)
        - Something else was pasted
        - Other
    validations:
      required: true
  - type: input
    id: format
    attributes:
      label: Output format
      placeholder: "APA citation / Pandoc [@key] / \\autocite / Typst ..."
  - type: input
    id: layout
    attributes:
      label: Keyboard layout and input method (if not US English)
      placeholder: "AZERTY, Dvorak, German, Japanese IME ..."
  - type: textarea
    id: details
    attributes:
      label: Anything else (no private content)
