labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Ibis stays small on purpose: please read [the roadmap and what is not planned](https://github.com/ibiscite/ibis/blob/main/ROADMAP.md) first. When an idea fits, the maintainer opens an issue for it.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do, and what gets in the way?
      description: What you write, where you write it, and which reference manager you use.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a small, useful improvement look like?
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I read the roadmap's "Not planned" list, and this isn't on it.
          required: true
