version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"
      include: "scope"
    # Let new releases age a week before proposing them; security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"
      include: "scope"
    # Let new releases age a week before proposing them; security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: monthly
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"
      include: "scope"
    # Let new releases age a week before proposing them; security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      desktop-web-dependencies:
        patterns: ["*"]
