name: In flight

# Keeps the tracking issue's In flight list equal to the open pull requests' handoffs.
on:
  pull_request:
    types: [opened, edited, reopened, closed, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: in-flight
  cancel-in-progress: true

jobs:
  in-flight:
    # Only the maintainer's own branches; the script lists no one else's.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: In flight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Main's reviewed script writes the issue, never a pull request's own copy.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Update the tracking issue
        run: node scripts/inflight.mjs --write
        env:
          GH_TOKEN: ${{ github.token }}
