name: Preview builds

# Builds the desktop app for Windows, macOS and Linux with checksums and
# build-provenance attestations.
#
# - Every push to main replaces the rolling "nightly" pre-release, so the
#   newest merged state can always be downloaded from one place.
# - Run manually (Actions → Preview builds → Run workflow) for a dry run:
#   leave publication unchecked; packages stay in workflow artifacts.
# - A maintainer's tag push, or Release Please's explicit dispatch at its tag,
#   verifies and publishes the packages (see RELEASING.md).
#
# Preview builds are unsigned: macOS builds are ad-hoc signed only and
# Windows builds carry no Authenticode signature. Update packages are signed
# with the Ibis update key (ADR 0019) by the publishing jobs only.
#
# Builds from a v tag are the app "Ibis". Every other build is "Ibis Nightly",
# a separate app with its own settings, a version such as
# 0.1.1-nightly.20261019223000 and its own update feed. It has no MSI (Windows
# Installer versions cannot carry "nightly") and no .rpm (RPM versions cannot
# contain "-").

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Path filters never apply to tag pushes, so releases always build.
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified packages (at a v tag, or refresh nightly on main)
        type: boolean
        default: false

permissions:
  contents: read

# Runs are never cancelled, so publication is never cut off halfway. While one
# runs, only the newest waiting push to main is kept.
concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple silicon), os: macos-15, target: aarch64-apple-darwin }
          - { name: macOS (Intel), os: macos-15, target: x86_64-apple-darwin }
          - { name: Windows, os: windows-2025, target: x86_64-pc-windows-msvc }
          - { name: Linux, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # The standard attestation records the workflow's OIDC commit. An older
      # release discovered by a later push must not claim that later source.
      - name: Verify provenance source commit
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$WORKFLOW_SHA" ]; then
            echo "::error::Release and workflow commits differ; rebuild from the release tag as described in RELEASING.md."
            exit 1
          fi

      # Ubuntu 22.04 keeps the Linux packages compatible with older glibc.
      # The app indicator library is needed for the tray item in the AppImage.
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev patchelf

      - name: Choose the app identity
        id: identity
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "Stable build: Ibis"
          else
            version=$(node scripts/update-feed.mjs version)
            echo "Nightly build: Ibis Nightly $version"
            config="$RUNNER_TEMP/nightly.conf.json"
            node scripts/update-feed.mjs config "$version" > "$config"
            echo "config=$config" >> "$GITHUB_OUTPUT"
          fi

      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # hdiutil on hosted macOS runners intermittently fails with "Resource
      # busy" while creating the disk image; a second attempt reuses the
      # compiled app and normally succeeds. Other failures are not retried.
      - name: Build the packages
        working-directory: apps/desktop
        env:
          TARGET: ${{ matrix.target }}
          CONFIG: ${{ steps.identity.outputs.config }}
        run: |
          build() { pnpm tauri build --ci --target "$TARGET" ${CONFIG:+--config "$CONFIG"} -- --locked 2>&1 | tee build.log; return "${PIPESTATUS[0]}"; }
          if ! build; then
            if [ "$RUNNER_OS" = macOS ] && grep -q 'hdiutil: create failed - Resource busy' build.log; then
              echo "::warning::hdiutil reported Resource busy; retrying the build once"
              sleep 15
              build
            else
              exit 1
            fi
          fi

      - name: Collect packages and checksums
        id: collect
        run: |
          bundle=target/${{ matrix.target }}/release/bundle
          mkdir -p dist
          find "$bundle" -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} dist/ \;
          if [ -z "$(ls dist)" ]; then
            echo "no packages were produced in $bundle" >&2
            exit 1
          fi
          # The macOS update package: the app in a gzipped tar, as the updater expects.
          if [ -d "$bundle/macos" ]; then
            app=$(find "$bundle/macos" -maxdepth 1 -name '*.app' -print -quit)
            COPYFILE_DISABLE=1 tar -czf "dist/$(basename "$app").tar.gz" -C "$bundle/macos" "$(basename "$app")"
          fi
          # Give each package a plain name that says which computer it is for.
          # Names carry no version, so a link to the nightly file never changes.
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) platform=macOS-Apple-silicon ;;
            x86_64-apple-darwin) platform=macOS-Intel ;;
            x86_64-pc-windows-msvc) platform=Windows ;;
            x86_64-unknown-linux-gnu) platform=Linux ;;
            *) echo "no download name for ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          for f in dist/*; do
            case "$f" in
              *-setup.exe) name="Ibis-$platform-setup.exe" ;;
              *.app.tar.gz) name="Ibis-$platform.app.tar.gz" ;;
              *) name="Ibis-$platform.${f##*.}" ;;
            esac
            if [ -e "dist/$name" ]; then echo "two packages would both be called $name" >&2; exit 1; fi
            mv "$f" "dist/$name"
          done
          # Write the list outside dist first, so it never lists itself.
          sums="SHA256SUMS-${{ matrix.target }}.txt"
          (cd dist && for f in *; do
            if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi
          done) > "$sums"
          mv "$sums" "dist/$sums"
          cat "dist/SHA256SUMS-${{ matrix.target }}.txt"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Keep the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ibis-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # Install each package the way a user would, start the installed app and
  # drive it with the native smoke test, so a broken installer or a package
  # that will not start is never published. The Intel disk image is built but
  # not installed: this job uses only Apple silicon macOS runners.
  install:
    name: Install and start (${{ matrix.name }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple silicon), os: macos-15, target: aarch64-apple-darwin }
          - { name: Windows, os: windows-2025, target: x86_64-pc-windows-msvc }
          - { name: Linux, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
    defaults:
      run:
        shell: bash
    env:
      IBIS_LIBRARY: ${{ github.workspace }}/fixtures/bibtex/real-world.bib
      # Matches "Choose the app identity" in the build job.
      IDENTIFIER: ${{ startsWith(github.ref, 'refs/tags/v') && 'io.github.ibiscite.ibis' || 'io.github.ibiscite.ibis.nightly' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ibis-${{ matrix.target }}
          path: dist

      # stays-up.py starts an installed app with the synthetic library and
      # fails if it exits within 20 seconds. diagnose.sh turns a failed
      # command and the end of its output into an annotation, so the cause is
      # visible on the run summary. The steps below reuse both.
      - name: Prepare the startup check
        run: |
          cat > "$RUNNER_TEMP/diagnose.sh" <<'SH'
          trap 'echo "::error::Failed at line $LINENO: $BASH_COMMAND"' ERR
          show() {
            local out="$RUNNER_TEMP/show.log" rc=0
            "$@" > "$out" 2>&1 || rc=$?
            cat "$out"
            if [ "$rc" -ne 0 ]; then
              echo "::error::exit $rc from $*%0A$(tail -n 40 "$out" | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            fi
            return "$rc"
          }
          SH
          cat > "$RUNNER_TEMP/stays-up.py" <<'PY'
          import subprocess, sys, time
          app = subprocess.Popen(sys.argv[1:])
          time.sleep(20)
          if app.poll() is not None:
              sys.exit(f"::error::{sys.argv[1]} exited with code {app.returncode} during startup")
          app.terminate()
          try:
              app.wait(timeout=10)
          except subprocess.TimeoutExpired:
              app.kill()
          print(f"{sys.argv[1]} started and stayed up")
          PY

      - name: Install, start and remove (Linux)
        if: runner.os == 'Linux'
        run: |
          . "$RUNNER_TEMP/diagnose.sh"
          sudo apt-get update
          # Only test tools here; the .deb must bring its own runtime libraries.
          sudo apt-get install -y --no-install-recommends xvfb xauth xdotool openbox xterm python3-pyatspi xclip at-spi2-core fonts-noto-core fonts-noto-cjk
          show sudo apt-get install -y ./dist/Ibis-Linux.deb
          package=$(dpkg-deb --field dist/Ibis-Linux.deb Package)
          app=$(dpkg -L "$package" | grep -m1 '^/usr/bin/')
          echo "installed $package at $app"
          display() { xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- "$@"; }
          show display /usr/bin/python3 scripts/smoke-native.py --app "$app" --output screenshots/install-Linux --identifier "$IDENTIFIER"
          show display /usr/bin/python3 "$RUNNER_TEMP/stays-up.py" "$app"
          sudo apt-get remove -y "$package"
          test ! -e "$app"
          # The AppImage needs FUSE 2, which Ubuntu 24.04 lacks by default;
          # extract-and-run starts the same bundled files without it.
          chmod +x dist/Ibis-Linux.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 show display /usr/bin/python3 "$RUNNER_TEMP/stays-up.py" "$PWD/dist/Ibis-Linux.AppImage"

      # The app's name is read from what the package installs, never assumed.
      - name: Install, start and remove (macOS)
        if: runner.os == 'macOS'
        run: |
          . "$RUNNER_TEMP/diagnose.sh"
          mount="$RUNNER_TEMP/ibis-dmg"
          apps="$RUNNER_TEMP/Applications"
          mkdir -p "$apps"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" dist/Ibis-macOS-Apple-silicon.dmg
          bundle=$(find "$mount" -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$bundle" || { echo "::error::The disk image holds no app"; exit 1; }
          installed="$apps/$(basename "$bundle")"
          ditto "$bundle" "$installed"
          hdiutil detach "$mount"
          codesign --verify --deep --strict "$installed"
          app=$(find "$installed/Contents/MacOS" -type f -perm -u+x | head -n 1)
          echo "installed at $app"
          show python3 scripts/smoke-native.py --app "$app" --output screenshots/install-macOS --identifier "$IDENTIFIER"
          show python3 "$RUNNER_TEMP/stays-up.py" "$app"
          rm -rf "$installed"

      - name: Install, start and remove (Windows)
        if: runner.os == 'Windows'
        run: |
          . "$RUNNER_TEMP/diagnose.sh"
          uninstall_keys() { pwsh -NoProfile -Command '(Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall).PSChildName' | tr -d '\r' | sort; }
          before=$(uninstall_keys)
          # The setup executable installs for the current user without prompts.
          show ./dist/Ibis-Windows-setup.exe //S
          # Find the install folder from the uninstall entry it registered.
          key=$(comm -13 <(echo "$before") <(uninstall_keys) | head -n 1)
          test -n "$key" || { echo "::error::The setup executable registered no uninstall entry"; exit 1; }
          uninstaller=$(KEY="$key" pwsh -NoProfile -Command '(Get-ItemProperty ("HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\" + $env:KEY)).UninstallString' | tr -d '"\r')
          dir=$(dirname "$(cygpath -u "$uninstaller")")
          app=$(find "$dir" -maxdepth 1 -iname '*.exe' ! -iname 'uninstall*' | head -n 1)
          test -n "$app" || { echo "::error::The setup executable installed no app in $dir"; exit 1; }
          echo "installed at $app"
          # The release build fails the smoke test's missing-library step on
          # Windows (#341); report it without blocking until that is fixed.
          show python scripts/smoke-native.py --app "$app" --output screenshots/install-Windows --identifier "$IDENTIFIER" ||
            echo "::warning::The native smoke test failed on the installed Windows app; see #341."
          show python "$RUNNER_TEMP/stays-up.py" "$app"
          "$dir/uninstall.exe" //S
          # The uninstaller copies itself and returns early; wait for removal.
          for _ in $(seq 30); do [ -e "$app" ] || break; sleep 2; done
          test ! -e "$app" || { echo "::error::The uninstaller left $app behind"; exit 1; }
          # Builds without an MSI skip the rest.
          [ -e dist/Ibis-Windows.msi ] || exit 0
          # The MSI installs for all users; the runner has administrator rights.
          # The install folder is read from the installer's own log.
          msiexec() {
            MSI="$(cygpath -w "$PWD/dist/Ibis-Windows.msi")" LOG="$(cygpath -w "$RUNNER_TEMP/msi-$1.log")" MODE="$1" pwsh -NoProfile -Command '
              $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/$env:MODE", "`"$env:MSI`"", "/qn", "/norestart", "/l*v", "`"$env:LOG`""
              exit $p.ExitCode'
          }
          msi_log() { tr -d '\000\r' < "$RUNNER_TEMP/msi-$1.log"; }
          if ! msiexec i; then
            show sh -c 'tail -n 40; exit 1' msiexec < <(msi_log i)
          fi
          installdir=$(msi_log i | sed -n 's/^.*Property(S): INSTALLDIR = //p')
          installdir=${installdir%%$'\n'*}
          if [ -z "$installdir" ]; then
            show sh -c 'grep -a "Property(S): .*\(DIR\|FOLDER\) = " | tail -n 40; exit 1' msiexec < <(msi_log i)
          fi
          dir=$(cygpath -u "$installdir")
          app=$(find "$dir" -maxdepth 1 -iname '*.exe' ! -iname 'uninstall*' | head -n 1)
          test -n "$app" || { echo "::error::The MSI installed no app in $dir"; exit 1; }
          echo "installed at $app"
          show python "$RUNNER_TEMP/stays-up.py" "$app"
          if ! msiexec x; then
            show sh -c 'tail -n 40; exit 1' msiexec < <(msi_log x)
          fi
          test ! -e "$app"

      - name: Keep install screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-${{ matrix.target }}
          path: screenshots/*
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish pre-release
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    needs: [build, install]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Holds the update signing key; only main and v tags may use it.
    environment: updates
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      # Only for the locked Tauri command line tool that signs updates.
      - name: Install the signing tool
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: ibis-*
          merge-multiple: true

      - name: Verify checksums and tag-bound provenance before publication
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS-*.txt)
          for file in dist/*; do
            gh attestation verify "$file" --repo "$REPO" --source-ref "$SOURCE_REF" --source-digest "$SOURCE_SHA" --signer-workflow "$REPO/.github/workflows/preview.yml"
          done

      # As in the nightly job: sign only verified packages, and stop if a
      # signature names any key other than the one built into the app.
      - name: Sign the update packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATE_SIGNING_KEY_PASSWORD }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The feed's version must be the one the app reports, or it would
          # offer the same release again and again.
          if [ "${TAG#v}" != "$(node scripts/update-feed.mjs release)" ]; then
            echo "::error::$TAG does not match the workspace version $(node scripts/update-feed.mjs release)."
            exit 1
          fi
          for file in Ibis-macOS-Apple-silicon.app.tar.gz Ibis-macOS-Intel.app.tar.gz Ibis-Windows-setup.exe Ibis-Linux.AppImage; do
            apps/desktop/node_modules/.bin/tauri signer sign "dist/$file" > /dev/null
          done
          mkdir feed
          mv dist/*.sig feed/
          node scripts/update-feed.mjs manifest feed "https://github.com/$REPO/releases/download/$TAG" \
            "${TAG#v}" "Ibis $TAG. Release notes: https://github.com/$REPO/releases/tag/$TAG"
          rm feed/*.sig
          cat feed/latest.json

      - name: Publish the verified pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'EOF'
          **Preview build. Not signed.** macOS may say the app cannot be checked for malicious software: right-click Ibis in Applications and choose Open. Windows SmartScreen may warn: choose More info, then Run anyway.

          Verify a download before opening it:

          - Checksums: compare the output of `shasum -a 256 <file>` (macOS, Linux) or `Get-FileHash <file>` (Windows) with the `SHA256SUMS-*.txt` files below.
          - Provenance: run `gh attestation verify <file> --repo ibiscite/ibis --source-ref refs/tags/TAG --signer-workflow ibiscite/ibis/.github/workflows/preview.yml`, replacing TAG with this release's tag. This rejects builds from other branches.
          EOF
          cat > windows-setup.md <<'EOF'
          **Windows installation:** if Microsoft WebView2 Runtime is missing, the installer downloads Microsoft's WebView2 bootstrapper and uses it to install the runtime. This one-time prerequisite setup requires an internet connection. The Ibis app works offline after setup.

          EOF
          if gh release view "$TAG" --repo "$REPO" --json body,isDraft > release.json; then
            if [ "$(jq -r .isDraft release.json)" != true ]; then
              echo "::error::The release is already public; refusing to replace its packages."
              exit 1
            fi
            jq -r .body release.json > existing-notes.md
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
            cp existing-notes.md combined-notes.md
            if ! grep -Fq '**Preview build. Not signed.**' existing-notes.md; then
              cat notes.md existing-notes.md > combined-notes.md
            fi
            if ! grep -Fq '**Windows installation:**' combined-notes.md; then
              cat windows-setup.md combined-notes.md > updated-notes.md
              mv updated-notes.md combined-notes.md
            fi
            gh release edit "$TAG" --repo "$REPO" --prerelease --draft=false --notes-file combined-notes.md
          else
            cat windows-setup.md notes.md > combined-notes.md
            gh release create "$TAG" dist/* --repo "$REPO" --prerelease --draft --title "Ibis $TAG (preview)" --notes-file combined-notes.md --verify-tag
            gh release edit "$TAG" --repo "$REPO" --draft=false
          fi

      # Signed by this job, published by the stable-feed job, which can be
      # re-run on its own if it fails after this release is public.
      - name: Keep the stable update feed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-feed
          path: feed/latest.json
          if-no-files-found: error

  stable-feed:
    name: Move the stable update feed
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: ibis-*
          merge-multiple: true

      - name: Download the signed feed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stable-feed
          path: feed

      # The rolling "stable" pre-release mirrors the newest release and the
      # stable app reads its latest.json (ADR 0019); the feed itself points at
      # the numbered release, which the publish job has made public. A tag
      # older than the current feed (a backport) leaves it in place.
      - name: Move the stable update feed to this release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
          FEED: stable
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS-*.txt)
          version=$(jq -r .version feed/latest.json)
          if current=$(gh release download "$FEED" --repo "$REPO" --pattern latest.json --output - 2>/dev/null | jq -r .version) && [ -n "$current" ]; then
            if [ "$current" != "$version" ] && ! node scripts/update-feed.mjs newer "$version" "$current"; then
              echo "::notice::The stable feed stays at $current, which is newer than $version."
              exit 0
            fi
          fi
          cat > feed-notes.md <<EOF
          **The newest Ibis release, [Ibis $TAG](https://github.com/$REPO/releases/tag/$TAG), at links that stay the same,** for example \`https://github.com/$REPO/releases/download/stable/Ibis-Windows-setup.exe\`. See that release for its notes and how to verify a download. \`latest.json\` is the update feed the stable app reads.
          EOF
          if ! gh release view "$FEED" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$FEED" --repo "$REPO" --draft --prerelease --target "$SHA" --title "Ibis update feed" --notes-file feed-notes.md
          fi
          # Packages first, the feed last; then remove files from older releases.
          gh release upload "$FEED" dist/* --repo "$REPO" --clobber
          gh release upload "$FEED" feed/latest.json --repo "$REPO" --clobber
          names=$(gh release view "$FEED" --repo "$REPO" --json assets --jq '.assets[].name')
          while IFS= read -r name; do
            if [ -n "$name" ] && [ ! -e "dist/$name" ] && [ ! -e "feed/$name" ]; then gh release delete-asset "$FEED" "$name" --repo "$REPO" --yes; fi
          done <<< "$names"
          if ! gh api --method PATCH "repos/$REPO/git/refs/tags/$FEED" -f sha="$SHA" -F force=true > /dev/null; then
            gh api --method POST "repos/$REPO/git/refs" -f ref="refs/tags/$FEED" -f sha="$SHA" > /dev/null
          fi
          gh release edit "$FEED" --repo "$REPO" --prerelease --draft=false --title "Ibis update feed" --notes-file feed-notes.md

  nightly:
    name: Publish nightly pre-release
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    needs: [build, install]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Holds the update signing key; only main and v tags may use it.
    environment: updates
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      # Only for the locked Tauri command line tool that signs updates.
      - name: Install the signing tool
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: ibis-*
          merge-multiple: true

      - name: Verify checksums and main-bound provenance before publication
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS-*.txt)
          for file in dist/*; do
            gh attestation verify "$file" --repo "$REPO" --source-ref refs/heads/main --source-digest "$SOURCE_SHA" --signer-workflow "$REPO/.github/workflows/preview.yml"
          done

      # Signs only packages whose checksums and provenance were just verified,
      # then lists them in the update file; a signature with any other key ID
      # stops publication.
      - name: Sign the update packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATE_SIGNING_KEY_PASSWORD }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for file in Ibis-macOS-Apple-silicon.app.tar.gz Ibis-macOS-Intel.app.tar.gz Ibis-Windows-setup.exe Ibis-Linux.AppImage; do
            apps/desktop/node_modules/.bin/tauri signer sign "dist/$file" > /dev/null
          done
          mkdir feed
          mv dist/*.sig feed/
          node scripts/update-feed.mjs manifest feed "https://github.com/$REPO/releases/download/nightly" \
            "$(node scripts/update-feed.mjs version)" "Nightly build of ${SHA:0:12} on main."
          rm feed/*.sig
          cat feed/latest.json

      # The update test (update-e2e job) starts the nightly being replaced and
      # lets it update itself to this one. Only the file is kept; nothing from
      # it runs in this job.
      - name: Keep the previous nightly for the update test
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir previous
          echo "Files of the nightly this run replaces, if it had an update feed." > previous/README.txt
          gh release download nightly --repo "$REPO" --pattern Ibis-Linux.AppImage --pattern latest.json --dir previous ||
            echo "No previous nightly with an update feed; the update test will be skipped."

      - name: Upload the previous nightly
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: previous-nightly
          path: previous/*
          if-no-files-found: error
          retention-days: 3

      # The nightly tag moves to each new main commit. It never matches v*, so
      # it starts no release build, and Release Please ignores it.
      - name: Replace the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: nightly
        run: |
          set -euo pipefail
          # An older run must not replace a newer nightly.
          latest=$(git ls-remote "https://github.com/$REPO" refs/heads/main | cut -f1)
          if [ "$latest" != "$SHA" ]; then
            echo "main has moved on to $latest; leaving the nightly to that run."
            exit 0
          fi
          built=$(date -u '+%Y-%m-%d %H:%M UTC')
          cat > notes.md <<EOF
          **Nightly development build of \`${SHA:0:12}\` on main, built $built.** It is replaced after changes to main and may be unfinished or broken. For the steadier version, use the newest numbered preview release.

          **Which file:** \`Ibis-macOS-Apple-silicon.dmg\` (M1 and later) or \`Ibis-macOS-Intel.dmg\` on a Mac, \`Ibis-Windows-setup.exe\` on Windows, \`Ibis-Linux.AppImage\` on Linux (\`.deb\` also available). It installs as **Ibis Nightly**, next to the stable Ibis and with its own settings, and can update itself if you allow update checks. The \`.app.tar.gz\` and \`latest.json\` files are for those updates.

          **Not signed.** macOS may say the app cannot be checked for malicious software: open System Settings → Privacy & Security and choose Open Anyway. Windows SmartScreen may warn: choose More info, then Run anyway. On Windows, if Microsoft WebView2 Runtime is missing, the installer downloads it once; Ibis works offline after setup.

          Verify a download: compare \`shasum -a 256 <file>\` (macOS, Linux) or \`Get-FileHash <file>\` (Windows) with the \`SHA256SUMS-*.txt\` files below, and check provenance with \`gh attestation verify <file> --repo $REPO --source-ref refs/heads/main --signer-workflow $REPO/.github/workflows/preview.yml\`.
          EOF
          # The first run starts from a draft, so an empty release is never public.
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --draft --prerelease --target "$SHA" --title "Ibis nightly" --notes-file notes.md
          fi
          # Packages and signatures first; the update file last, so an app never
          # reads a feed that names packages not yet uploaded.
          gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          gh release upload "$TAG" feed/latest.json --repo "$REPO" --clobber
          # Remove packages this build no longer produces, such as an old version number.
          names=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
          while IFS= read -r name; do
            if [ -n "$name" ] && [ ! -e "dist/$name" ] && [ ! -e "feed/$name" ]; then gh release delete-asset "$TAG" "$name" --repo "$REPO" --yes; fi
          done <<< "$names"
          # Move the tag (or create it, on the first run or if it was removed),
          # then publish the notes last, so they never name a commit early.
          if ! gh api --method PATCH "repos/$REPO/git/refs/tags/$TAG" -f sha="$SHA" -F force=true > /dev/null; then
            gh api --method POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" > /dev/null
          fi
          gh release edit "$TAG" --repo "$REPO" --prerelease --draft=false --title "Ibis nightly" --notes-file notes.md

  update-e2e:
    name: Update the previous nightly to this one (Linux)
    needs: nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download the previous nightly
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: previous-nightly
          path: previous

      - name: Download this build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ibis-x86_64-unknown-linux-gnu
          path: dist

      # Runs only when the previous nightly can update (it has a feed) and the
      # published feed now names this build, which the nightly job skips when
      # main has already moved on.
      - name: Decide whether to run
        id: decide
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(node scripts/update-feed.mjs version)
          published=$(curl -fsSL "https://github.com/$REPO/releases/download/nightly/latest.json" | jq -r .version)
          if [ ! -f previous/latest.json ] || [ ! -f previous/Ibis-Linux.AppImage ]; then
            echo "::notice::Update test skipped: the previous nightly had no update feed."
          elif [ "$published" != "$version" ]; then
            echo "::notice::Update test skipped: the published nightly is $published, not this build ($version)."
          elif [ "$(jq -r .version previous/latest.json)" = "$version" ]; then
            echo "::notice::Update test skipped: the previous nightly is this same build."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Updating $(jq -r .version previous/latest.json) to $version"
          fi

      - name: Update the previous nightly
        if: steps.decide.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth python3-pyatspi at-spi2-core libfuse2t64 fonts-noto-core
          /usr/bin/python3 scripts/update-e2e.py --self-test
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- /usr/bin/python3 scripts/update-e2e.py \
            --previous previous/Ibis-Linux.AppImage --expected dist/Ibis-Linux.AppImage --output update-e2e

      - name: Upload the update test logs
        if: always() && steps.decide.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-e2e
          path: update-e2e/*
          if-no-files-found: warn
          retention-days: 14
