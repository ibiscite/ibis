name: Preview builds

# Builds the desktop app for Windows, macOS and Linux with checksums and
# build-provenance attestations.
#
# - Run manually (Actions → Preview builds → Run workflow) for a dry run:
#   the packages are kept as workflow artifacts and nothing is published.
# - A maintainer's tag push, or the direct call after Release Please creates a
#   release, also attaches packages to the GitHub pre-release (see RELEASING.md).
#
# Preview builds are unsigned: macOS builds are ad-hoc signed only and
# Windows builds carry no Authenticode signature.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Existing release tag to receive the packages
        required: true
        type: string
      release-sha:
        description: Exact commit tagged by Release Please
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-${{ inputs.release-tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple silicon), os: macos-15, target: aarch64-apple-darwin }
          - { name: macOS (Intel), os: macos-15, target: x86_64-apple-darwin }
          - { name: Windows, os: windows-2025, target: x86_64-pc-windows-msvc }
          - { name: Linux, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release-sha || github.sha }}

      # The standard attestation records the workflow's OIDC commit. An older
      # release discovered by a later push must not claim that later source.
      - name: Verify provenance source commit
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$WORKFLOW_SHA" ]; then
            echo "::error::Release and workflow commits differ; rebuild from the release tag as described in RELEASING.md."
            exit 1
          fi

      # Ubuntu 22.04 keeps the Linux packages compatible with older glibc.
      # The app indicator library is needed for the tray item in the AppImage.
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev patchelf

      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # hdiutil on hosted macOS runners intermittently fails with "Resource
      # busy" while creating the disk image; a second attempt reuses the
      # compiled app and normally succeeds. Other failures are not retried.
      - name: Build the packages
        working-directory: apps/desktop
        env:
          TARGET: ${{ matrix.target }}
        run: |
          build() { pnpm tauri build --ci --target "$TARGET" -- --locked 2>&1 | tee build.log; return "${PIPESTATUS[0]}"; }
          if ! build; then
            if [ "$RUNNER_OS" = macOS ] && grep -q 'hdiutil: create failed - Resource busy' build.log; then
              echo "::warning::hdiutil reported Resource busy; retrying the build once"
              sleep 15
              build
            else
              exit 1
            fi
          fi

      - name: Collect packages and checksums
        id: collect
        run: |
          bundle=target/${{ matrix.target }}/release/bundle
          mkdir -p dist
          find "$bundle" -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} dist/ \;
          if [ -z "$(ls dist)" ]; then
            echo "no packages were produced in $bundle" >&2
            exit 1
          fi
          # Write the list outside dist first, so it never lists itself.
          sums="SHA256SUMS-${{ matrix.target }}.txt"
          (cd dist && for f in *; do
            if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi
          done) > "$sums"
          mv "$sums" "dist/$sums"
          cat "dist/SHA256SUMS-${{ matrix.target }}.txt"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Keep the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ibis-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish pre-release
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || inputs.release-tag != '')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'EOF'
          **Preview build. Not signed.** macOS may say the app cannot be checked for malicious software: right-click Ibis in Applications and choose Open. Windows SmartScreen may warn: choose More info, then Run anyway.

          Verify a download before opening it:

          - Checksums: compare the output of `shasum -a 256 <file>` (macOS, Linux) or `Get-FileHash <file>` (Windows) with the `SHA256SUMS-*.txt` files below.
          - Provenance: `gh attestation verify <file> --repo ibiscite/ibis` confirms the file was built by this repository's workflow.
          EOF
          if gh release view "$TAG" --repo "$REPO" --json body --jq .body > existing-notes.md; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
            if grep -Fq '**Preview build. Not signed.**' existing-notes.md; then
              gh release edit "$TAG" --repo "$REPO" --prerelease
            else
              cat notes.md existing-notes.md > combined-notes.md
              gh release edit "$TAG" --repo "$REPO" --prerelease --notes-file combined-notes.md
            fi
          else
            gh release create "$TAG" dist/* --repo "$REPO" --prerelease --title "Ibis $TAG (preview)" --notes-file notes.md --verify-tag
          fi
