name: Preview builds

# Builds the desktop app for Windows, macOS and Linux with checksums and
# build-provenance attestations.
#
# - Every push to main replaces the rolling "nightly" pre-release, so the
#   newest merged state can always be downloaded from one place.
# - Nightly/release builds also check 60 seconds of offline behaviour. Real
#   Zotero runs here and on the daily schedule. Release checks (minimum Rust,
#   release-mode tests and speed limits) run beside the builds: a failure
#   stops a numbered release, never a nightly.
# - Once a day, and when run manually with "Only rerun the update test", the
#   update-e2e job updates the nightly that the newest nightly replaced to the
#   newest nightly, using the packages that nightly's run kept. Until #493 is
#   fixed it fails on Windows and macOS, so it no longer runs after every push.
# - Run manually (Actions → Preview builds → Run workflow) for a dry run:
#   leave publication unchecked; packages stay in workflow artifacts.
# - A tag push, by a maintainer or by Release Please's app at a release merge,
#   verifies and publishes the packages (see RELEASING.md).
#
# macOS builds are signed with Ibis's own self-signed certificate once the
# maintainer has configured the identity (docs/code-signing.md), so
# the identity can persist across updates; Gatekeeper still warns. Windows
# builds carry no Authenticode signature. Update packages are signed
# with the Ibis update key (ADR 0019) by the publishing jobs only.
#
# Builds from a v tag are the app "Ibis". Every other build is "Ibis Nightly",
# a separate app with its own settings, a version such as
# 0.1.1-nightly.20261019223000 and its own update feed. It has no MSI (Windows
# Installer versions cannot carry "nightly") and no .rpm (RPM versions cannot
# contain "-").

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Path filters never apply to tag pushes, so releases always build.
    paths-ignore: ["**.md", "docs/**", "website/**"]
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified packages (at a v tag, or refresh nightly on main)
        type: boolean
        default: false
      zotero_capture_version:
        description: "Exact Zotero release for an opt-in synthetic capture (empty keeps the ordinary smoke test)"
        required: false
        type: string
        default: ""
      update_test:
        description: Only rerun the update test on the newest nightly (main only; builds nothing)
        type: boolean
        default: false

permissions:
  contents: read

# Runs are never cancelled, so publication is never cut off halfway. While one
# runs, only the newest waiting push to main is kept.
# The update test has its own group, so a waiting push never replaces it.
concurrency:
  group: preview-${{ github.ref_name }}${{ (github.event_name == 'schedule' || inputs.update_test) && '-update-test' || '' }}
  cancel-in-progress: false

jobs:
  # A manual run that would silently do nothing fails here instead.
  inputs:
    name: Check the run options
    if: github.event_name == 'workflow_dispatch' && inputs.update_test && (github.ref != 'refs/heads/main' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Refuse conflicting options
        run: |
          echo "::error::\"Only rerun the update test\" runs only on main and cannot be combined with publishing. Run it on main with publishing unchecked."
          exit 1

  bibtex-fuzz:
    name: Damaged BibTeX fuzzing (five minutes)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.update_test)
    runs-on: ubuntu-24.04
    # Compilation and tool setup are outside the five-minute fuzzing budget.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up nightly Rust
        run: rustup toolchain install nightly --profile minimal

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: bibtex-fuzz

      - name: Install cargo-fuzz
        run: cargo +stable install cargo-fuzz --version 0.13.1 --locked

      - name: Test the seed corpus
        run: cargo +nightly test -p ibis-fuzz --locked seed_corpus

      - name: Build the fuzz target
        run: cargo +nightly fuzz build damaged_bibtex --features fuzzing --target-dir target/fuzz

      - name: Fuzz the real BibTeX loader for five minutes
        timeout-minutes: 6
        run: cargo +nightly fuzz run damaged_bibtex --features fuzzing --target-dir target/fuzz -- -max_total_time=300 -timeout=5 -max_len=65536 -rss_limit_mb=2048

      - name: Keep fuzz failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bibtex-fuzz-failures-${{ github.sha }}-${{ github.run_attempt }}
          path: fuzz/artifacts/damaged_bibtex/
          if-no-files-found: ignore
          retention-days: 14

  zotero:
    name: Real Zotero
    if: ${{ !inputs.update_test }}
    # Reads what an actual Zotero sends, so a change in Zotero's answers or
    # a wrong assumption about them fails here rather than on a tester's
    # computer. Downloads the current Zotero release from zotero.org.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Zotero's system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xdotool libdbus-glib-1-2 libasound2t64 libgtk-3-0t64 libxtst6

      - name: Run the real-Zotero test
        if: github.event_name != 'workflow_dispatch' || inputs.zotero_capture_version == ''
        run: scripts/real-zotero.sh

      - name: Capture a pinned synthetic Zotero database and API pair
        if: github.event_name == 'workflow_dispatch' && inputs.zotero_capture_version != ''
        env:
          ZOTERO_CAPTURE_VERSION: ${{ inputs.zotero_capture_version }}
          ZOTERO_CAPTURE_OUTPUT: ${{ runner.temp }}/zotero-synthetic-capture
        run: scripts/real-zotero.sh --capture "$ZOTERO_CAPTURE_VERSION" "$ZOTERO_CAPTURE_OUTPUT"

      # These are unreviewed test artifacts, not committed/version-support fixtures.
      - name: Keep the synthetic capture for fixture review
        if: success() && github.event_name == 'workflow_dispatch' && inputs.zotero_capture_version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zotero-synthetic-capture-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zotero-synthetic-capture/*
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build (${{ matrix.name }})
    # The update test alone builds and publishes nothing; every later
    # publishing job needs this one, so it is skipped with it.
    if: github.event_name != 'schedule' && !inputs.update_test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple silicon), os: macos-15, target: aarch64-apple-darwin }
          - { name: macOS (Intel), os: macos-15, target: x86_64-apple-darwin }
          - { name: Windows, os: windows-2025, target: x86_64-pc-windows-msvc }
          - { name: Linux, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # The standard attestation records the workflow's OIDC commit. An older
      # release discovered by a later push must not claim that later source.
      - name: Verify provenance source commit
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$WORKFLOW_SHA" ]; then
            echo "::error::Release and workflow commits differ; rebuild from the release tag as described in RELEASING.md."
            exit 1
          fi

      # Ubuntu 22.04 keeps the Linux packages compatible with older glibc.
      # The app indicator library is needed for the tray item in the AppImage.
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev patchelf xvfb xauth imagemagick iproute2 lsof musl-tools

      - name: Choose the app identity
        id: identity
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "Stable build: Ibis"
          else
            version=$(node scripts/update-feed.mjs version)
            echo "Nightly build: Ibis Nightly $version"
            config="$RUNNER_TEMP/nightly.conf.json"
            node scripts/update-feed.mjs config "$version" > "$config"
            echo "config=$config" >> "$GITHUB_OUTPUT"
            # The command line and About report this, so a report names the build.
            echo "IBIS_VERSION=$version+${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          fi

      # Linux builds the command line for musl too: a static binary runs on
      # every distribution, NixOS included, with no system libraries.
      - name: Add the Rust target
        run: |
          rustup target add ${{ matrix.target }}
          if [ "$RUNNER_OS" = Linux ]; then rustup target add x86_64-unknown-linux-musl; fi

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # On Windows retry a gateway failure fetching a pinned NSIS tool.
      # On macOS hdiutil can fail with "Resource busy" when creating the disk
      # image. A second attempt reuses the compiled app and normally succeeds.
      - name: Build the packages
        id: native_build
        working-directory: apps/desktop
        env:
          TARGET: ${{ matrix.target }}
          CONFIG: ${{ steps.identity.outputs.config }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then exec bash ../../scripts/build-windows-packages.sh; fi
          build() { pnpm tauri build --ci --target "$TARGET" ${CONFIG:+--config "$CONFIG"} -- --locked 2>&1 | tee build.log; return "${PIPESTATUS[0]}"; }
          if ! build; then
            if [ "$RUNNER_OS" = macOS ] && grep -q 'hdiutil: create failed - Resource busy' build.log; then
              echo "::warning::hdiutil reported Resource busy; retrying the build once"
              sleep 15
              build
            else
              exit 1
            fi
          fi

      # The command line ships on its own too, for people, scripts and AI
      # agents. It runs here where it can, so a binary that cannot start is
      # never published (Intel macOS is cross-built on Apple silicon).
      - name: Build the command line
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/build-cli.sh

      - name: Capture the picker (Linux and macOS)
        if: runner.os != 'Windows' && matrix.target != 'x86_64-apple-darwin'
        working-directory: .
        env:
          TARGET: ${{ matrix.target }}
          CONFIG: ${{ steps.identity.outputs.config }}
          IBIS_LIBRARY: ${{ github.workspace }}/fixtures/bibtex/real-world.bib
        run: scripts/capture-picker.sh

      - name: Capture the picker (Windows)
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          IBIS_LIBRARY: ${{ github.workspace }}/fixtures/bibtex/real-world.bib
        run: ./scripts/capture-picker.ps1

      # Uploads still run after a job timeout (which counts as cancelled) so
      # a hang leaves its logs.
      - name: Keep screenshots and startup logs
        if: always() && matrix.target != 'x86_64-apple-darwin'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: picker-${{ github.sha }}-${{ matrix.target }}
          path: screenshots/*
          if-no-files-found: warn
          retention-days: 14

      - name: Collect packages and checksums
        id: collect
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/collect-packages.sh

      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # Compact evidence can be inspected without transferring package bytes.
      # This records provenance and hashes; it does not claim a fresh download.
      - name: Collect package proof
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          TARGET: ${{ matrix.target }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          mkdir proof
          printf 'source_sha=%s\nsource_ref=%s\ntarget=%s\n' "$SOURCE_SHA" "$SOURCE_REF" "$TARGET" > proof/source.txt
          cp dist/SHA256SUMS-* proof/
          cp "$BUNDLE" proof/build-provenance.json

      - name: Keep package proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-proof-${{ matrix.target }}
          path: proof/*
          if-no-files-found: error
          retention-days: 14

      - name: Keep the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ibis-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release-checks:
    name: Release checks (Linux)
    if: github.event_name != 'schedule' && !inputs.update_test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test core and sources in release mode
        run: cargo test -p ibis-core -p ibis-sources --release --locked

      - name: Test the declared minimum Rust version
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 test --locked

      - name: Report 100k open/refresh budgets (release)
        run: node scripts/preview-budgets.mjs

  windows-paste:
    name: Paste into Notepad (Windows)
    if: github.event_name != 'schedule' && !inputs.update_test
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Build the web interface
        shell: bash
        run: bash scripts/build-web.sh
      - name: Verify the owned Notepad destination
        run: cargo test -p ibis-desktop --release --locked --target x86_64-pc-windows-msvc one_ctrl_v_pastes_the_clipboard_into_the_app_in_front -- --ignored --nocapture

  # Signs the macOS app with Ibis's own certificate (#1242, scripts/macos-sign.sh),
  # to preserve paste permission across updates (qualification: #1242). The
  # certificate never meets the build's dependencies. Without the certificate
  # (forks, before setup) the packages stay ad-hoc signed.
  sign-macos:
    # A missing repository pin means signing is disabled. Do not even refer to
    # the environment until configured: GitHub would otherwise create it.
    if: vars.MACOS_SIGNING_LEAF != ''
    name: Sign (${{ matrix.name }})
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    # Holds the signing certificate; deployable only from main and v tags.
    environment: macos-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple silicon), target: aarch64-apple-darwin, platform: macOS-Apple-silicon }
          - { name: macOS (Intel), target: x86_64-apple-darwin, platform: macOS-Intel }
    defaults:
      run:
        shell: bash
    env:
      # Matches "Choose the app identity" in the build job.
      IDENTIFIER: ${{ startsWith(github.ref, 'refs/tags/v') && 'com.ibiscite.ibis' || 'com.ibiscite.ibis.nightly' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ibis-${{ matrix.target }}
          path: dist

      - name: Download package proof
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-proof-${{ matrix.target }}
          path: proof

      # The build job and its dependencies never receive the identity. Verify
      # all inputs before the following step makes the key available.
      - name: Verify source-bound package provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          (cd dist && shasum -a 256 --check SHA256SUMS-*.txt)
          for file in dist/*; do
            gh attestation verify "$file" --repo "$REPO" --source-ref "$SOURCE_REF" --source-digest "$SOURCE_SHA" --signer-workflow "$REPO/.github/workflows/preview.yml"
          done

      - name: Sign the app and its disk image
        id: sign
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          MACOS_SIGNING_LEAF: ${{ vars.MACOS_SIGNING_LEAF }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          scripts/macos-sign.sh sign dist "$PLATFORM" "$IDENTIFIER"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        id: provenance
        if: steps.sign.outputs.signed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Ibis-${{ matrix.platform }}.dmg
            dist/Ibis-${{ matrix.platform }}.app.tar.gz
            dist/SHA256SUMS-${{ matrix.target }}.txt

      - name: Collect signed package proof
        if: steps.sign.outputs.signed == 'true'
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          LEAF: ${{ vars.MACOS_SIGNING_LEAF }}
        run: |
          cp dist/SHA256SUMS-* proof/
          cp "$BUNDLE" proof/signing-provenance.json
          printf 'certificate_sha1=%s\n' "$LEAF" > proof/signing.txt

      - name: Keep signed package proof
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-proof-${{ matrix.target }}
          path: proof/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Keep the signed packages
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ibis-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # Install each package the way a user would, start the installed app and
  # drive it with the native smoke test, so a broken installer or a package
  # that will not start is never published. The Intel disk image is built but
  # not installed: this job uses only Apple silicon macOS runners.
  install:
    name: Install and start (${{ matrix.name }})
    needs: [build, sign-macos, windows-paste]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.windows-paste.result == 'success' && (needs.sign-macos.result == 'success' || needs.sign-macos.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple silicon), os: macos-15, target: aarch64-apple-darwin }
          - { name: Windows, os: windows-2025, target: x86_64-pc-windows-msvc }
          - { name: Linux, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
    defaults:
      run:
        shell: bash
    env:
      IBIS_LIBRARY: ${{ github.workspace }}/fixtures/bibtex/real-world.bib
      # Matches "Choose the app identity" in the build job.
      IDENTIFIER: ${{ startsWith(github.ref, 'refs/tags/v') && 'com.ibiscite.ibis' || 'com.ibiscite.ibis.nightly' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ibis-${{ matrix.target }}
          path: dist

      # People download the command line on its own, so check that archive:
      # unpack it as they would and cite from a synthetic library.
      - name: Run the command line from its archive
        run: |
          mkdir cli
          case "$RUNNER_OS" in
            Windows) (cd cli && 7z x ../dist/ibis-Windows.zip > /dev/null); bin=cli/ibis.exe ;;
            macOS) tar -xzf dist/ibis-macOS-Apple-silicon.tar.gz -C cli; bin=cli/ibis ;;
            *) tar -xzf dist/ibis-Linux.tar.gz -C cli; bin=cli/ibis ;;
          esac
          test -f cli/LICENSE && test -f cli/NOTICE.md
          "$bin" search garcia --file fixtures/bibtex/fidelity.bib
          "$bin" cite accents2021 --file fixtures/bibtex/fidelity.bib --style apa

      - name: Install, start and remove
        run: bash scripts/install-and-start.sh

      - name: Keep install screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-${{ matrix.target }}
          path: screenshots/*
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    needs: [build, install, release-checks]
    # The Latest read and publish must not interleave.
    concurrency:
      group: publish-numbered-release
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Holds the stable update signing key; only v tags may use it, after the
    # maintainer approves the deployment.
    environment: updates
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No shared dependency cache in a job that holds a signing key.

      # Only for the locked Tauri command line tool that signs updates.
      - name: Install the signing tool
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: ibis-*
          merge-multiple: true

      - name: Verify checksums and tag-bound provenance before publication
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS-*.txt)
          for file in dist/*; do
            gh attestation verify "$file" --repo "$REPO" --source-ref "$SOURCE_REF" --source-digest "$SOURCE_SHA" --signer-workflow "$REPO/.github/workflows/preview.yml"
          done

      # As in the nightly job: sign only verified packages, and stop if a
      # signature names any key other than the one built into the app.
      - name: Sign the update packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATE_SIGNING_KEY_PASSWORD }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: scripts/sign-update-packages.sh release

      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: scripts/publish-release.sh

      # Signed by this job, published by the stable-feed job, which can be
      # re-run on its own if it fails after this release is public.
      - name: Keep the stable update feed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-feed
          path: feed/latest.json
          if-no-files-found: error

  stable-feed:
    name: Move the stable update feed
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    needs: publish
    # The version check and uploads must not interleave.
    concurrency:
      group: publish-stable-feed
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: ibis-*
          merge-multiple: true

      - name: Download the signed feed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stable-feed
          path: feed

      # The fixed "stable" tag anchors permanent downloads; its release's files
      # mirror the newest release. The stable app reads latest.json (ADR 0019),
      # which points at the numbered release made public by the publish job.
      # An older tag (a backport) leaves the current feed in place.
      - name: Move the stable update feed to this release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
          FEED: stable
        run: scripts/publish-stable-feed.sh

  nightly:
    name: Publish nightly pre-release
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    needs: [build, install]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Holds the nightly update signing key, which Ibis (stable) never trusts.
    environment: nightly
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No shared dependency cache in a job that holds a signing key.

      # Only for the locked Tauri command line tool that signs updates.
      - name: Install the signing tool
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: ibis-*
          merge-multiple: true

      - name: Verify checksums and main-bound provenance before publication
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS-*.txt)
          for file in dist/*; do
            gh attestation verify "$file" --repo "$REPO" --source-ref refs/heads/main --source-digest "$SOURCE_SHA" --signer-workflow "$REPO/.github/workflows/preview.yml"
          done

      # Signs only packages whose checksums and provenance were just verified,
      # then lists them in the update file; a signature with any other key ID
      # stops publication.
      - name: Sign the update packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATE_SIGNING_KEY_PASSWORD }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: scripts/sign-update-packages.sh nightly

      # The update test (update-e2e job) starts the nightly being replaced and
      # lets it update itself to this one. Only the files are kept; nothing from
      # it runs in this job.
      - name: Keep the previous nightly for the update test
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: scripts/keep-previous-nightly.sh

      - name: Upload the previous nightly
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: previous-nightly
          path: previous/*
          if-no-files-found: error
          # As long as the packages, so the daily update test can use both.
          retention-days: 14

      # The nightly tag moves to each new main commit. It never matches v*, so
      # it starts no release build, and Release Please ignores it.
      - name: Replace the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: nightly
        run: scripts/publish-nightly.sh

  update-e2e:
    name: Update the previous nightly to the newest (${{ matrix.name }})
    # Not after every push until #493 is fixed: it fails on Windows and macOS.
    # It reuses the files the newest nightly's own run kept, so it tests the
    # same update a push run would have tested.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.update_test)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      # Only to download the artifacts of the run that published the nightly.
      actions: read
      # Only to open or update the issue when the daily run fails.
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, package: Ibis-Linux.AppImage }
          - { name: Windows, os: windows-2025, target: x86_64-pc-windows-msvc, package: Ibis-Windows-setup.exe }
          - { name: macOS (Apple silicon), os: macos-15, target: aarch64-apple-darwin, package: Ibis-macOS-Apple-silicon.app.tar.gz }
    defaults:
      run:
        shell: bash
    steps:
      # The nightly tag names the commit of the newest nightly. The first run
      # at that commit that kept files published it: it kept the nightly it
      # replaced and its own packages (both for 14 days).
      - name: Find the run that published the nightly
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$REPO/git/ref/tags/nightly" --jq .object.sha)
          # Assigned first, so an API error fails the step instead of an empty loop.
          runs=$(gh api "repos/$REPO/actions/workflows/preview.yml/runs?branch=main&head_sha=$sha" --jq '.workflow_runs | reverse | .[].id')
          run=""
          for id in $runs; do
            names=$(gh api "repos/$REPO/actions/runs/$id/artifacts?per_page=100" --jq '.artifacts[] | select(.expired | not) | .name')
            if grep -qx previous-nightly <<< "$names" && grep -qx "ibis-$TARGET" <<< "$names"; then run=$id; break; fi
          done
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ -n "$run" ]; then
            echo "run=$run" >> "$GITHUB_OUTPUT"
            echo "Testing the nightly from ${sha:0:12}, published by run $run"
          elif [ "$EVENT" = workflow_dispatch ]; then
            echo "::notice::Update test skipped: the run that published nightly ${sha:0:12} kept no unexpired previous nightly."
          else
            echo "::error::The run that published nightly ${sha:0:12} kept no unexpired previous nightly, so nothing was tested."
            exit 1
          fi

      - name: Checkout the nightly's commit
        if: steps.source.outputs.run != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.source.outputs.sha }}

      # Keep the publisher's checkout for its exact nightly version below.
      # Qualification fixes must run immediately, without waiting for those
      # fixes to be included in a newly published app. Keep all sibling helpers.
      - name: Checkout the current qualification tools
        if: steps.source.outputs.run != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: qualification

      - name: Download the previous nightly
        if: steps.source.outputs.run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: previous-nightly
          path: previous
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}

      - name: Download the newest nightly's build
        if: steps.source.outputs.run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ibis-${{ matrix.target }}
          path: dist
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}

      # Runs only when the previous nightly can update (it has a feed and this
      # system's package) and the published feed still names this build.
      - name: Decide whether to run
        id: decide
        if: steps.source.outputs.run != ''
        env:
          REPO: ${{ github.repository }}
          PACKAGE: ${{ matrix.package }}
        # Through bash: Windows checkouts have no executable bit.
        run: bash qualification/scripts/update-test-decision.sh

      - name: Update the previous nightly (Linux)
        if: steps.decide.outputs.run == 'true' && runner.os == 'Linux'
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth python3-pyatspi at-spi2-core libfuse2t64 fonts-noto-core xdotool openbox x11-utils
          # AppImages leave graphics drivers to the system. WebKit loads GLES dynamically, so ldd misses it.
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgles2 libgl1 libgl1-mesa-dri libgbm1 libdrm2 libwayland-client0 libx11-xcb1
          /usr/bin/python3 qualification/scripts/update-e2e.py --self-test
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- /usr/bin/python3 qualification/scripts/update-e2e.py \
            --previous "previous/$PACKAGE" --expected "dist/$PACKAGE" --output update-e2e

      # Installs the previous nightly into the runner account (setup
      # executable for the current user on Windows, the .app from its update
      # archive on macOS) and allows update checks in that account's settings.
      - name: Update the previous nightly (Windows and macOS)
        if: steps.decide.outputs.run == 'true' && runner.os != 'Linux'
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          python=python3
          if [ "$RUNNER_OS" = Windows ]; then python=python; fi
          "$python" qualification/scripts/update-e2e.py --self-test
          "$python" qualification/scripts/update-e2e.py --previous "previous/$PACKAGE" --expected "dist/$PACKAGE" \
            --version "$VERSION" --output update-e2e

      - name: Upload the update test logs
        if: always() && steps.decide.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-e2e-${{ matrix.target }}
          path: update-e2e/*
          if-no-files-found: warn
          retention-days: 14

      # A red scheduled run notifies nobody by itself.
      - name: Report a failed daily update test
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ matrix.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Installed-update test failing on main ($NAME)"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          body="Failed on the newest nightly: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label type:task --label area:infra --body "$body"
          fi
