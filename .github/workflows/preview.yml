name: Preview builds

# Builds the desktop app for Windows, macOS and Linux with checksums and
# build-provenance attestations.
#
# - Run manually (Actions → Preview builds → Run workflow) for a dry run:
#   the packages are kept as workflow artifacts and nothing is published.
# - Pushing a tag v* also publishes them as a GitHub pre-release. Tags are
#   pushed only by a maintainer (see RELEASING.md).
#
# Preview builds are unsigned: macOS builds are ad-hoc signed only and
# Windows builds carry no Authenticode signature.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple silicon), os: macos-15, target: aarch64-apple-darwin }
          - { name: macOS (Intel), os: macos-15, target: x86_64-apple-darwin }
          - { name: Windows, os: windows-2025, target: x86_64-pc-windows-msvc }
          - { name: Linux, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ubuntu 22.04 keeps the Linux packages compatible with older glibc.
      # The app indicator library is needed for the tray item in the AppImage.
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev patchelf

      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build the packages
        working-directory: apps/desktop
        run: pnpm tauri build --ci --target ${{ matrix.target }} -- --locked

      - name: Collect packages and checksums
        id: collect
        run: |
          bundle=target/${{ matrix.target }}/release/bundle
          mkdir -p dist
          find "$bundle" -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} dist/ \;
          if [ -z "$(ls dist)" ]; then
            echo "no packages were produced in $bundle" >&2
            exit 1
          fi
          cd dist
          for f in *; do
            if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi
          done > SHA256SUMS-${{ matrix.target }}.txt
          cat SHA256SUMS-${{ matrix.target }}.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Keep the packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ibis-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'EOF'
          **Preview build. Not signed.** macOS may say the app cannot be checked for malicious software: right-click Ibis in Applications and choose Open. Windows SmartScreen may warn: choose More info, then Run anyway.

          Verify a download before opening it:

          - Checksums: compare the output of `shasum -a 256 <file>` (macOS, Linux) or `Get-FileHash <file>` (Windows) with the `SHA256SUMS-*.txt` files below.
          - Provenance: `gh attestation verify <file> --repo ibis-cite/ibis` confirms the file was built by this repository's workflow.
          EOF
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --prerelease
          else
            gh release create "$TAG" dist/* --repo "$REPO" --prerelease --title "Ibis $TAG (preview)" --notes-file notes.md --verify-tag
          fi
