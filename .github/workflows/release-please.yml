name: Release Please

# Keeps a release pull request up to date from Conventional Commits on main.
# Merging that pull request creates the version tag, GitHub release and
# changelog entry, then calls the shared package workflow directly: tags made
# with GITHUB_TOKEN do not start another push workflow.
#
# Inactive until the repository variable RELEASE_PLEASE is set to "enabled"
# (see RELEASING.md), so the job is skipped rather than failing before
# GitHub Actions is allowed to open pull requests.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    if: vars.RELEASE_PLEASE == 'enabled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  packages:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/preview.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      release-tag: ${{ needs.release-please.outputs.tag_name }}
      release-sha: ${{ needs.release-please.outputs.sha }}
