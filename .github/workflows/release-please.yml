name: Release Please

# Keeps a release pull request up to date from Conventional Commits on main.
# Merging that pull request creates a draft release, tag and changelog.
# It runs with a token from the release GitHub App, not GITHUB_TOKEN, because
# pushes made with GITHUB_TOKEN start no workflows: the release pull request
# would get no "CI result" and the tag would build no packages. With the app's
# token, CI runs on the release pull request and the tag push starts
# preview.yml, which verifies the packages before publishing. A release is
# tagged only when the merge queue checked its exact commit.
#
# Inactive until the repository variable RELEASE_PLEASE is set to "enabled"
# (see RELEASING.md), so the job is skipped rather than failing before
# GitHub Actions is allowed to open pull requests.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    if: vars.RELEASE_PLEASE == 'enabled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Everything is done with the app's token (Contents, Pull requests and
    # Issues: read and write on this repository only). Its credentials live in
    # the release environment.
    environment: release
    # Reading the queue's CI runs for the release gate; nothing is written with it.
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A release merged outside the merge queue is refused before any tag
      # exists: the release pull request's own run checks nothing.
      - name: Release only a commit the merge queue checked
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: scripts/release-gate.sh
      - name: Mint the release app token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Update the release pull request or create the release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
