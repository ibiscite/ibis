name: Release Please

# Keeps a release pull request up to date from Conventional Commits on main.
# Merging that pull request creates a draft release, tag and changelog, then
# dispatches packaging at the tag. GITHUB_TOKEN cannot trigger tag-push workflows,
# but it can dispatch a workflow explicitly. Packaging verifies before publishing.
#
# Inactive until the repository variable RELEASE_PLEASE is set to "enabled"
# (see RELEASING.md), so the job is skipped rather than failing before
# GitHub Actions is allowed to open pull requests.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    if: vars.RELEASE_PLEASE == 'enabled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Update the release pull request or create the release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  packages:
    name: Dispatch tag-pinned preview build
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Build and verify at the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: gh workflow run preview.yml --repo "$REPO" --ref "$TAG" --field publish=true
