name: CI

on:
  push:
    branches: [main]
    # A merge that changes only Markdown was already checked on its pull
    # request and in the merge queue. Other files under docs/ (for example
    # docs/design-geometry.json) feed tests, so they run CI.
    paths-ignore: ["**.md"]
  pull_request:
  # The merge queue tests each pull request on top of current main. Every job
  # that "CI result" needs runs in full here; nothing is filtered by path.
  merge_group:
  workflow_dispatch:
  # Weekly drift check of the pinned Nix inputs. That run also does the Linux
  # checks but skips the native app build (see the changes job).
  schedule:
    - cron: "23 4 * * 1"

# On a pull request, a newer push cancels the run in progress. On main, a run
# that has started always finishes, so its caches are saved and its evidence is
# collected; GitHub keeps only the newest waiting push and replaces older ones
# before they start, so a burst of merges never runs every commit. The weekly
# run has its own group so it never replaces a waiting run for a main commit.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  nix:
    name: Nix package (Linux)
    needs: changes
    # Not required. Pull requests run it only when packaging inputs change.
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          enable_kvm: false
          extra_nix_config: |
            sandbox = true
            max-jobs = 2
            cores = 2

      - name: Evaluate the pinned package
        run: |
          mkdir -p nix-evidence
          git rev-parse HEAD > nix-evidence/source-commit.txt
          nix config show sandbox | tee nix-evidence/sandbox.txt
          test "$(cat nix-evidence/sandbox.txt)" = true
          nix flake check --no-build --no-update-lock-file
          nix eval --raw --no-update-lock-file .#ibis.drvPath > nix-evidence/derivation.txt

      - name: Build and inspect the installed package
        run: |
          nix flake check -L --no-update-lock-file 2>&1 | tee nix-evidence/build.log
          nix build -L --out-link result --no-update-lock-file .#ibis 2>&1 | tee -a nix-evidence/build.log
          nix path-info --no-update-lock-file .#ibis > nix-evidence/store-path.txt
          nix profile add --profile "$RUNNER_TEMP/ibis-profile" --no-update-lock-file .#ibis
          test -x "$RUNNER_TEMP/ibis-profile/bin/ibis-desktop"

      - name: Exercise the packaged app with synthetic data
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth xdotool xclip xterm openbox x11-utils python3-pyatspi at-spi2-core
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- /usr/bin/python3 scripts/smoke-native.py --app result/bin/ibis-desktop --output nix-evidence/runtime --skip-performance

      - name: Preserve Nix build and runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nix-package-${{ github.sha }}
          path: nix-evidence
          if-no-files-found: warn
          retention-days: 14

  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.classify.outputs.native }}
      web: ${{ steps.classify.outputs.web }}
      nix: ${{ steps.classify.outputs.nix }}
    steps:
      # Interface-only pull requests keep web validation without native jobs.
      # Desktop jobs still report success, preserving required check names.
      # Main, the merge queue and unclear file lists build the complete app.
      # The Nix package is rebuilt only when its inputs change (a stale
      # nix/pnpm-deps-hash fails on the pull request that causes it), weekly
      # and on manual runs. The weekly run skips the native app build.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide which app checks must run
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EXPECTED: ${{ github.event.pull_request.changed_files }}
          EXPECTED_REFS: ${{ github.event.pull_request.head.sha }}:${{ github.event.pull_request.base.sha }}
        run: |
          # Pin the API list to this event's head and base across pagination.
          # Failed reads, changed refs or a partial list enable every check.
          unset FILES
          if [ "$EVENT" = pull_request ] &&
            before=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha + ":" + .base.sha') && [ "$before" = "$EXPECTED_REFS" ] &&
            gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | {filename, previous_filename, status} | @json' > "$RUNNER_TEMP/changed-files.ndjson" &&
            after=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha + ":" + .base.sha') && [ "$after" = "$EXPECTED_REFS" ]; then
            export FILES="$RUNNER_TEMP/changed-files.ndjson"
          fi
          node scripts/ci-paths.mjs | tee -a "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows run the same checks inside their Desktop jobs,
        # which already build on those systems; one runner each per change.
        os: [ubuntu-24.04]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Pull requests restore main's caches but never write their own,
          # which would evict main's from the repository's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --locked

      - name: Test
        run: cargo test --locked

      - name: Test core in release mode (Linux)
        if: runner.os == 'Linux'
        run: cargo test -p ibis-core --release --locked

      - name: Test the declared minimum Rust version (Linux)
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 test --locked


  web:
    name: Web interface
    needs: changes
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble@sha256:51d31fdfacb0cff99a1a724152e34ae408d2bd4e7da310ff157450f49261cc59
      options: --init
    timeout-minutes: 10
    env:
      NATIVE: ${{ needs.changes.outputs.native }}
      WEB: ${{ needs.changes.outputs.web }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      # Checkout and install always run: the script tests below need the
      # interface's dependencies (the UI import check parses with Vite's
      # parser), and some read Markdown (docs/design.md), so they run even on
      # a documentation-only change.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      # Every script test, as scripts/check.mjs runs them locally.
      - name: Script tests, UI import boundary and style tokens
        working-directory: .
        run: |
          node scripts/check.mjs --script-tests
          node scripts/ui-imports.mjs
          node scripts/style-lint.mjs

      - name: Type check and test the interface
        if: env.WEB == 'true'
        run: |
          pnpm typecheck
          pnpm test
          pnpm build
          test ! -e dist/gallery.html
          pnpm exec vite build --mode evidence
          test -f dist/gallery.html

      - name: Render every browser gallery frame
        id: gallery
        if: env.WEB == 'true'
        working-directory: .
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/ibis-gallery/node_modules
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
        run: |
          npm install --prefix "$RUNNER_TEMP/ibis-gallery" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.62.0
          node scripts/gallery-contact-sheet.mjs --no-build

      - name: Keep browser gallery evidence
        if: ${{ !cancelled() && env.WEB == 'true' && steps.gallery.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: picker-browser-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: target/gallery-contact-sheet
          if-no-files-found: warn
          retention-days: 14

      - name: Share the checked web interface
        if: env.NATIVE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-web
          path: apps/desktop/dist
          if-no-files-found: error
          retention-days: 1

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: [changes, web]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      NATIVE: ${{ needs.changes.outputs.native }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        # bash stops at the first failing command on every OS; PowerShell on
        # Windows would continue and report only the last command's result.
        shell: bash
    steps:
      - name: Note a change without native checks
        if: env.NATIVE != 'true'
        run: echo "::notice::No native inputs changed; native checks run on main and in the merge queue."

      - name: Checkout
        if: env.NATIVE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Windows updater activation contracts
        if: env.NATIVE == 'true' && runner.os == 'Windows'
        run: |
          command -v pwsh
          python -B scripts/update-e2e.py --self-test

      - name: Install system WebView libraries (Linux)
        if: env.NATIVE == 'true' && (runner.os == 'Linux')
        working-directory: .
        run: |
          # Prefer the HTTPS archive already configured by runner-images (#857).
          sudo python3 - <<'PY'
          from pathlib import Path

          path = Path("/etc/apt/apt-mirrors.txt")
          archive = "https://archive.ubuntu.com/ubuntu/"
          lines = path.read_text().splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if line.split()[:1] == [archive]]
          if len(matches) != 1 or lines[matches[0]].split() not in (
              [archive, "priority:2"], [archive, "priority:0"]
          ):
              raise SystemExit("expected runner archive mirror is missing or ambiguous")
          lines[matches[0]] = f"{archive}\tpriority:0\n"
          path.write_text("".join(lines))
          PY
          # Match runner-images' acquire bounds even on images with older defaults (#857).
          ibis_apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          sudo apt-get "${ibis_apt_options[@]}" update
          sudo apt-get "${ibis_apt_options[@]}" install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev librsvg2-bin fonts-inter libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf xvfb xauth imagemagick fonts-noto-core fonts-noto-cjk xdotool x11-utils openbox xterm python3-pyatspi xclip at-spi2-core iproute2 lsof

      - name: Check generated brand assets (Linux)
        if: env.NATIVE == 'true' && runner.os == 'Linux'
        run: node scripts/check.mjs --brand-assets

      - name: Cache Rust build
        if: env.NATIVE == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Pull requests restore main's caches but never write their own,
          # which would evict main's from the repository's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Download the checked web interface
        if: env.NATIVE == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-web
          path: apps/desktop/dist

      - name: Lint and test the core and scripts (macOS and Windows)
        if: env.NATIVE == 'true' && runner.os != 'Linux'
        run: |
          cargo clippy --all-targets --locked
          cargo test --locked
          node scripts/check.mjs --platform-script-tests

      - name: Lint, test and build the app
        if: env.NATIVE == 'true'
        id: native_build
        working-directory: .
        run: |
          cargo clippy -p ibis-desktop --all-targets --locked
          cargo test -p ibis-desktop --locked
          # Embed the built interface; a plain debug build uses localhost:5173.
          cargo build -p ibis-desktop --locked --features tauri/custom-protocol

      - name: Capture the picker (Linux and macOS)
        if: env.NATIVE == 'true' && (runner.os != 'Windows')
        working-directory: .
        env:
          IBIS_LIBRARY: ${{ github.workspace }}/fixtures/bibtex/real-world.bib
        run: |
          mkdir -p screenshots
          capture() {
            # Complete Linux fd/socket attribution needs a privileged observer.
            local observer=()
            if [ "$RUNNER_OS" = Linux ]; then observer=(sudo -n); fi
            python3 scripts/check-offline.py --record-baseline screenshots/offline-$RUNNER_OS.json
            target/debug/ibis-desktop > screenshots/startup-$RUNNER_OS.log 2>&1 &
            app_pid=$!
            trap 'kill "$app_pid" 2>/dev/null || true' EXIT
            # Observe startup as well as the delayed background services.
            "${observer[@]}" python3 scripts/check-offline.py --pid "$app_pid" --baseline screenshots/offline-$RUNNER_OS.json --seconds 60
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "::error::The picker exited during startup; see the startup log."
              exit 1
            fi
            if [ "$RUNNER_OS" = Linux ]; then
              import -window root screenshots/picker-Linux.png || echo "::warning::Linux screenshot capture failed."
            else
              screencapture -x screenshots/picker-macOS.png || echo "::warning::macOS screenshot capture failed."
            fi
          }
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash -e -c "$(declare -f capture); capture"
          else
            capture
          fi

      - name: Capture the picker (Windows)
        if: env.NATIVE == 'true' && (runner.os == 'Windows')
        working-directory: .
        shell: pwsh
        env:
          IBIS_LIBRARY: ${{ github.workspace }}/fixtures/bibtex/real-world.bib
        run: |
          ./scripts/check-offline.tests.ps1
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $app = Start-Process target/debug/ibis-desktop.exe -NoNewWindow -PassThru -RedirectStandardOutput screenshots/startup-Windows.log -RedirectStandardError screenshots/stderr-Windows.log
          try {
            # Observe startup as well as delayed WebView2 background services.
            ./scripts/check-offline.ps1 -AppId $app.Id -Seconds 60
            if ($app.HasExited) { throw 'The picker exited during startup; see the startup logs.' }
            try {
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bitmap = [System.Drawing.Bitmap]::new($bounds.Width, $bounds.Height)
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              try {
                $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
                $bitmap.Save("$PWD/screenshots/picker-Windows.png")
              } finally { $graphics.Dispose(); $bitmap.Dispose() }
            } catch { Write-Output "::warning::Windows screenshot capture failed: $($_.Exception.Message)" }
          } finally { if (!$app.HasExited) { Stop-Process -Id $app.Id -Force } }

      - name: Capture every synthetic picker state (Linux)
        if: ${{ !cancelled() && env.NATIVE == 'true' && steps.native_build.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          python3 -B scripts/test_capture_gallery.py
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- python3 scripts/capture-gallery.py --app target/debug/ibis-desktop --output screenshots/gallery-Linux

      - name: Exercise the native picker (Linux)
        if: ${{ !cancelled() && env.NATIVE == 'true' && steps.native_build.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          /usr/bin/python3 scripts/smoke-native.py --self-test
          /usr/bin/python3 scripts/check-offline.test.py
          xvfb-run -a -s '-screen 0 1280x800x24' cargo test -p ibis-desktop --locked x11_server_focus_stays_with_editor_during_keyboard_grab -- --ignored --nocapture
          xvfb-run -a -s '-screen 0 1280x800x24' cargo test -p ibis-desktop --locked a_full_screen_active_window_is_detected_from_window_manager_hints -- --ignored --nocapture
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- /usr/bin/python3 scripts/smoke-native.py --app target/debug/ibis-desktop --output screenshots/smoke-Linux --budgets scripts/smoke-budgets.json
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- /usr/bin/python3 scripts/smoke-native.py --app target/debug/ibis-desktop --output screenshots/preferences-Linux --first-run-preferences

      # The Native UI job exercises this exact build on macOS and Windows.
      - name: Keep the built app for Native UI
        if: env.NATIVE == 'true' && runner.os != 'Linux' && steps.native_build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-app-${{ github.sha }}-${{ runner.os }}
          path: target/debug/ibis-desktop${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      # Uploads still run after a job timeout (which counts as cancelled) so
      # a hang leaves its logs; publishing happens only in the screenshots job.
      - name: Keep screenshots and startup logs
        if: always() && env.NATIVE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: picker-${{ github.sha }}-${{ runner.os }}
          path: screenshots/*
          if-no-files-found: warn
          retention-days: 14

  native-ui:
    name: Native UI (${{ matrix.os }})
    # Not a required check. macOS and Windows UI automation on hosted runners
    # is the flakiest part of CI (#361, #410, #464), so it runs here, beside
    # the required Desktop jobs instead of inside them: a failure turns this
    # job red where everyone can see it without holding a pull request, and
    # on main it also opens or updates an issue.
    needs: [changes, desktop]
    # Desktop is one matrix, so its result is failed if any system failed.
    # Run whenever it ran; a system whose build failed has no app to exercise.
    if: ${{ !cancelled() && needs.changes.outputs.native == 'true' && needs.desktop.result != 'skipped' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      # Only to read whether this system's Desktop job failed.
      actions: read
      # Only to open or update the issue when native UI smoke fails on main.
      issues: write
    env:
      # The slow macOS and Windows evidence (all gallery states, appearance
      # changes) runs on main and on manual runs, where it covers each merge,
      # but not in the merge queue, which waits only for required checks.
      EVIDENCE: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the app built by Desktop
        id: app
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-app-${{ github.sha }}-${{ runner.os }}
          path: target/debug

      # A missing app is only expected when this system's Desktop job failed
      # (that required check is already red); otherwise nothing was tested.
      - name: Check why the app is missing
        id: missing
        if: steps.app.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP: Desktop (${{ matrix.os }})
          JOBS: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100
        run: |
          conclusion=$(gh api "$JOBS" --jq ".jobs[] | select(.name == \"$DESKTOP\") | .conclusion")
          case "$conclusion" in
            failure | cancelled | timed_out)
              echo "::warning::$DESKTOP ended '$conclusion' and built no app, so native UI was not exercised." ;;
            *)
              echo "::error::$DESKTOP ended '${conclusion:-unknown}' but its app could not be downloaded; native UI was not exercised."
              exit 1 ;;
          esac

      - name: Prepare the app
        if: steps.app.outcome == 'success'
        run: |
          chmod +x target/debug/ibis-desktop* || true
          mkdir -p screenshots

      # Add to the Desktop job's screenshots and logs so evidence publication
      # still sees one artifact per system.
      - name: Download the Desktop screenshots
        id: shots
        if: steps.app.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: picker-${{ github.sha }}-${{ runner.os }}
          path: screenshots

      - name: Capture every synthetic picker state
        if: ${{ !cancelled() && env.EVIDENCE == 'true' && steps.app.outcome == 'success' }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python -B scripts/test_capture_gallery.py
            python scripts/capture-gallery.py --app target/debug/ibis-desktop.exe --output screenshots/gallery-Windows
          else
            python3 -B scripts/test_capture_gallery.py
            python3 scripts/capture-gallery.py --app target/debug/ibis-desktop --output screenshots/gallery-macOS
          fi

      - name: Exercise the native picker (macOS)
        id: native_macos
        if: ${{ !cancelled() && steps.app.outcome == 'success' && runner.os == 'macOS' }}
        run: |
          python3 scripts/smoke-native.py --self-test
          python3 scripts/check-offline.test.py
          python3 scripts/smoke-native.py --app target/debug/ibis-desktop --output screenshots/smoke-macOS --budgets scripts/smoke-budgets.json
          python3 scripts/smoke-native.py --app target/debug/ibis-desktop --output screenshots/preferences-macOS --first-run-preferences

      - name: Keep failed macOS native diagnostics immediately
        if: always() && runner.os == 'macOS' && steps.native_macos.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-failure-${{ github.sha }}-macOS
          path: |
            screenshots/smoke-macOS/*.json
            screenshots/smoke-macOS/*.log
            screenshots/preferences-macOS/*.json
            screenshots/preferences-macOS/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Exercise the full-screen macOS panel
        id: native_panel
        if: ${{ !cancelled() && steps.app.outcome == 'success' && runner.os == 'macOS' }}
        run: |
          python3 scripts/check-panel-macos.py --self-test
          python3 scripts/check-panel-macos.py --app target/debug/ibis-desktop --output screenshots/panel-macOS

      - name: Exercise the native picker (Windows)
        id: native_windows
        if: ${{ !cancelled() && steps.app.outcome == 'success' && runner.os == 'Windows' }}
        run: |
          python scripts/smoke-native.py --self-test
          python scripts/smoke-native.py --app target/debug/ibis-desktop.exe --output screenshots/smoke-Windows --budgets scripts/smoke-budgets.json
          python scripts/smoke-native.py --app target/debug/ibis-desktop.exe --output screenshots/preferences-Windows --first-run-preferences

      - name: Observe native materials and accessibility changes (macOS)
        if: ${{ !cancelled() && env.EVIDENCE == 'true' && steps.app.outcome == 'success' && runner.os == 'macOS' }}
        run: |
          python3 -B scripts/test_native_appearance_macos.py
          python3 scripts/check-native-appearance-macos.py --app target/debug/ibis-desktop --output screenshots/appearance-macOS

      - name: Report native UI failures on main
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.event_name != 'merge_group' && (steps.missing.outcome == 'failure' || steps.native_macos.outcome == 'failure' || steps.native_panel.outcome == 'failure' || steps.native_windows.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Native UI smoke failing on main ($RUNNER_OS)"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          body="Failed on $GITHUB_SHA: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label type:task --label area:infra --body "$body"
          fi

      # Replaces the Desktop job's artifact with the same files plus these,
      # but only when those files were downloaded first.
      - name: Keep screenshots and logs
        if: always() && steps.shots.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: picker-${{ github.sha }}-${{ runner.os }}
          path: screenshots/*
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

      # Without them, keep this job's files apart so Desktop's are never
      # replaced; evidence publication does not read this name.
      - name: Keep screenshots and logs separately
        if: always() && steps.app.outcome == 'success' && steps.shots.outcome != 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-ui-${{ github.sha }}-${{ runner.os }}
          path: screenshots/*
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  screenshots:
    name: Collect picker screenshots
    needs: [changes, desktop, native-ui]
    # A failed Web interface skips every Desktop job, so there is nothing to
    # publish. One failed Desktop platform still leaves the others to publish.
    if: ${{ !cancelled() && needs.changes.outputs.native == 'true' && needs.desktop.result != 'skipped' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # GitHub cannot restrict GITHUB_TOKEN to a branch. Keep write permission in
    # this job only, gate all untrusted forks out, and pin pushes in the script.
    permissions:
      contents: write
    steps:
      - name: Checkout evidence publisher
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download native screenshots for publication
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: picker-${{ github.sha }}-*
          path: evidence-input

      - name: Publish synthetic screenshots to evidence
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVIDENCE_SHA: ${{ github.sha }}
          EVIDENCE_INPUT: evidence-input
        run: node scripts/publish-evidence.mjs

      - name: Combine platform artifacts
        uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Preserve earlier outputs on retries and keep them outside the input glob.
          name: picker-combined-${{ github.sha }}-attempt-${{ github.run_attempt }}
          pattern: picker-${{ github.sha }}-*
          retention-days: 14
          delete-merged: true

  fidelity:
    name: Citation fidelity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Pull requests restore main's caches but never write their own,
          # which would evict main's from the repository's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - name: Compare rendering from BibTeX and from CSL export
        env:
          IBIS_REQUIRE_PANDOC: "1"
        run: cargo test -p ibis --test fidelity --locked

  zotero:
    name: Real Zotero
    # Reads what an actual Zotero sends, so a change in Zotero's answers or
    # a wrong assumption about them fails here rather than on a tester's
    # computer. Downloads the current Zotero release from zotero.org.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Zotero's system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libdbus-glib-1-2 libasound2t64 libgtk-3-0t64 libxtst6

      - name: Run the real-Zotero test
        run: scripts/real-zotero.sh

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflow expressions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color -shellcheck= -pyflakes=

      - name: Licenses, advisories, sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked

  # One check that stands for every required job, for the ruleset to require
  # instead of six names. A matrix job skipped because a job it needs failed
  # never reports its per-system checks; this job always reports. Every
  # needed job must succeed: none of them has a condition of its own, so
  # skipped only happens when something upstream failed or was cancelled.
  # It also refuses stacked pull requests: every pull request targets main.
  result:
    name: CI result
    if: always()
    needs: [changes, test, web, desktop, fidelity, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every needed job to pass and main as the base
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          echo "Results: $RESULTS"
          if [ "$EVENT" = pull_request ] && [ "$BASE" != main ]; then
            echo "::error::This pull request targets '$BASE'. Stacked pull requests are not allowed: retarget it to main."
            exit 1
          fi
          set -- $RESULTS
          if [ "$#" -ne 6 ]; then
            echo "::error::Expected 6 job results, got $#."
            exit 1
          fi
          for result in "$@"; do
            if [ "$result" != success ]; then
              echo "::error::A required job ended '$result'."
              exit 1
            fi
          done
