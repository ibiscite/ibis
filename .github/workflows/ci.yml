name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request replaces its older run. Every commit on main
# gets its own group and runs to completion, so each merged state is tested.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Pull requests restore main's caches but never write their own,
          # which would evict main's from the repository's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --locked

      - name: Test
        run: cargo test --locked

      - name: Test core in release mode (Linux)
        if: runner.os == 'Linux'
        run: cargo test -p ibis-core --release --locked

      - name: Fuzz reporter tests
        run: node --test scripts/fuzz.test.mjs

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        # bash stops at the first failing command on every OS; PowerShell on
        # Windows would continue and report only the last command's result.
        shell: bash
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system WebView libraries (Linux)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf xvfb xauth imagemagick

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Pull requests restore main's caches but never write their own,
          # which would evict main's from the repository's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check and test the interface
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Lint, test and build the app
        working-directory: .
        run: |
          cargo clippy -p ibis-desktop --all-targets --locked
          cargo test -p ibis-desktop --locked
          # Embed the built interface; a plain debug build uses localhost:5173.
          cargo build -p ibis-desktop --locked --features tauri/custom-protocol

      - name: Capture the picker (Linux and macOS)
        if: runner.os != 'Windows'
        working-directory: .
        env:
          IBIS_LIBRARY: ${{ github.workspace }}/fixtures/bibtex/real-world.bib
        run: |
          mkdir -p screenshots
          capture() {
            target/debug/ibis-desktop > screenshots/startup-$RUNNER_OS.log 2>&1 &
            app_pid=$!
            trap 'kill "$app_pid" 2>/dev/null || true' EXIT
            sleep 8
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "::error::The picker exited during startup; see the startup log."
              exit 1
            fi
            if [ "$RUNNER_OS" = Linux ]; then
              import -window root screenshots/picker-Linux.png || echo "::warning::Linux screenshot capture failed."
            else
              screencapture -x screenshots/picker-macOS.png || echo "::warning::macOS screenshot capture failed."
            fi
          }
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash -c "$(declare -f capture); capture"
          else
            capture
          fi

      - name: Capture the picker (Windows)
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        env:
          IBIS_LIBRARY: ${{ github.workspace }}/fixtures/bibtex/real-world.bib
        run: |
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $app = Start-Process target/debug/ibis-desktop.exe -NoNewWindow -PassThru -RedirectStandardOutput screenshots/startup-Windows.log -RedirectStandardError screenshots/stderr-Windows.log
          try {
            Start-Sleep -Seconds 8
            if ($app.HasExited) { throw 'The picker exited during startup; see the startup logs.' }
            try {
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bitmap = [System.Drawing.Bitmap]::new($bounds.Width, $bounds.Height)
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              try {
                $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
                $bitmap.Save("$PWD/screenshots/picker-Windows.png")
              } finally { $graphics.Dispose(); $bitmap.Dispose() }
            } catch { Write-Output "::warning::Windows screenshot capture failed: $($_.Exception.Message)" }
          } finally { if (!$app.HasExited) { Stop-Process -Id $app.Id -Force } }

      - name: Keep screenshots and startup logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: picker-${{ github.sha }}-${{ runner.os }}
          path: screenshots/*
          if-no-files-found: warn
          retention-days: 14

  screenshots:
    name: Collect picker screenshots
    needs: desktop
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Combine platform artifacts
        uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: picker-${{ github.sha }}
          pattern: picker-${{ github.sha }}-*
          retention-days: 14
          delete-merged: true

  fidelity:
    name: Citation fidelity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Pull requests restore main's caches but never write their own,
          # which would evict main's from the repository's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - name: Compare rendering from BibTeX and from CSL export
        env:
          IBIS_REQUIRE_PANDOC: "1"
        run: cargo test -p ibis --test fidelity --locked

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflow expressions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color -shellcheck= -pyflakes=

      - name: Licenses, advisories, sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked
