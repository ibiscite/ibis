name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
    - cron: "43 5 * * 1" # Weekly full advisory check and one issue on failure.
  workflow_dispatch:

# Main verifies each pushed revision; pull requests cancel superseded runs.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Debug information makes up most of what Windows compiles and links here.
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -D warnings

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.classify.outputs.core }}
      interface: ${{ steps.classify.outputs.interface }}
      native: ${{ steps.classify.outputs.native }}
      scripts: ${{ steps.classify.outputs.scripts }}
      web: ${{ steps.classify.outputs.web }}
      systems: ${{ steps.classify.outputs.systems }}
    steps:
      # Interface-only and website-only changes keep web validation
      # without native jobs and without building the interface for them.
      # A Linux Desktop placeholder still reports success for "CI result".
      # Script-only changes add their tests on Windows (and macOS on
      # daily/manual runs) without building the app. Changes only inside
      # apps/desktop skip the crates' tests. Unclear file lists build everything.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide which app checks must run
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EXPECTED: ${{ github.event.pull_request.changed_files }}
          EXPECTED_REFS: ${{ github.event.pull_request.head.sha }}:${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          ACTOR: ${{ github.triggering_actor }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: scripts/ci-changes.sh

      # Desktop embeds the interface built here, so it starts as soon as the
      # files are classified instead of after every Web interface check. That
      # job checks the same commit, and "CI result" needs both.
      - name: Set up Node.js
        if: steps.classify.outputs.native == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up pnpm
        if: steps.classify.outputs.native == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Build the web interface
        if: steps.classify.outputs.native == 'true'
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build
          node ../../scripts/picker-budget.mjs dist

      - name: Share the web interface
        if: steps.classify.outputs.native == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-web
          path: apps/desktop/dist
          if-no-files-found: error
          retention-days: 1

  # Linux is the fast core suite; daily/manual qualification adds all systems.
  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.systems) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Windows updater activation contracts
        if: runner.os == 'Windows'
        run: |
          command -v pwsh
          python -B scripts/update-e2e.py --self-test

      - name: Test the Windows offline observer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-offline.tests.ps1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests restore main's caches but never write their own,
          # which would evict main's from the repository's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint
        run: cargo clippy --all-targets --locked

      - name: Test
        run: cargo test --locked

      # Installed only now: with Pandoc present, cargo test also runs the
      # syntax_contract consumer tests, which fail on Ubuntu's older Pandoc.
      - name: Install Pandoc
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - name: Compare rendering from BibTeX and from CSL export
        if: runner.os == 'Linux'
        env:
          IBIS_REQUIRE_PANDOC: "1"
        run: cargo test -p ibis --test fidelity --locked

  web:
    name: Web interface
    needs: changes
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble@sha256:51d31fdfacb0cff99a1a724152e34ae408d2bd4e7da310ff157450f49261cc59
      options: --init
    timeout-minutes: 10
    env:
      WEB: ${{ needs.changes.outputs.web }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      # Checkout and install always run: the script tests below need the
      # interface and some read Markdown (docs/design/), so they run even on
      # a documentation-only change.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Choose Ubuntu package cache (web)
        id: apt
        working-directory: .
        run: bash scripts/ci-ubuntu-deps.sh cache-key web >> "$GITHUB_OUTPUT"

      - name: Cache Ubuntu package downloads (web)
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: /var/cache/apt/archives
          key: apt-ubuntu-24.04-web-${{ steps.apt.outputs.key }}

      # Every script test, as scripts/check.mjs runs them locally.
      - name: Script tests
        working-directory: .
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
        run: |
          bash scripts/ci-ubuntu-deps.sh web
          node scripts/check.mjs --script-tests

      - name: Type check and test the interface
        if: env.WEB == 'true'
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm exec vite build
          node ../../scripts/picker-budget.mjs dist

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CORE: ${{ needs.changes.outputs.core }}
      NATIVE: ${{ needs.changes.outputs.native }}
      SCRIPTS: ${{ needs.changes.outputs.scripts }}
    strategy:
      fail-fast: false
      matrix:
        # Without native inputs only a Linux placeholder reports, so a docs or
        # interface change never waits for macOS or Windows runners. Script
        # changes add Windows, and macOS when touched or on daily/manual runs.
        os: >-
          ${{ (needs.changes.outputs.native == 'true' || (needs.changes.outputs.scripts == 'true' && contains(fromJSON(needs.changes.outputs.systems), 'macos-15')))
          && fromJSON('["ubuntu-24.04", "macos-15", "windows-2025"]')
          || needs.changes.outputs.scripts == 'true' && fromJSON('["ubuntu-24.04", "windows-2025"]')
          || fromJSON('["ubuntu-24.04"]') }}
    defaults:
      run:
        # bash stops at the first failing command on every OS; PowerShell on
        # Windows would continue and report only the last command's result.
        shell: bash
    steps:
      - name: Note a change without native checks
        if: env.NATIVE != 'true'
        run: echo "::notice::No native inputs changed, so the app is not built here."

      - name: Checkout
        if: env.NATIVE == 'true' || env.SCRIPTS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare Ubuntu package cache (Linux)
        if: env.NATIVE == 'true' && runner.os == 'Linux'
        id: apt
        run: |
          sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives
          bash scripts/ci-ubuntu-deps.sh cache-key desktop >> "$GITHUB_OUTPUT"

      - name: Cache Ubuntu package downloads (desktop)
        if: env.NATIVE == 'true' && runner.os == 'Linux'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: /var/cache/apt/archives
          key: apt-ubuntu-24.04-desktop-${{ steps.apt.outputs.key }}

      - name: Install system WebView libraries (Linux)
        if: env.NATIVE == 'true' && (runner.os == 'Linux')
        working-directory: .
        run: |
          bash scripts/ci-ubuntu-deps.sh desktop
          sudo chmod -R a+rX /var/cache/apt/archives

      - name: Check generated brand assets (Linux)
        if: env.NATIVE == 'true' && runner.os == 'Linux'
        run: node scripts/check.mjs --brand-assets

      - name: Format
        if: env.NATIVE == 'true' && runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Cache Rust build
        if: env.NATIVE == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests restore main's caches but never write their own,
          # which would evict main's from the repository's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Download the web interface
        if: env.NATIVE == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-web
          path: apps/desktop/dist

      # Compile desktop test targets before unrelated suites so contract errors
      # report early on every native platform.
      - name: Lint all desktop targets
        if: env.NATIVE == 'true'
        run: cargo clippy -p ibis-desktop -p ibis-desktop-macros --all-targets --locked

      - name: Lint, test and build the app
        if: env.NATIVE == 'true'
        id: native_build
        working-directory: .
        run: |
          cargo test -p ibis-desktop -p ibis-desktop-macros --locked
          # Embed the built interface; a plain debug build uses localhost:5173.
          cargo build -p ibis-desktop --locked --features tauri/custom-protocol

      # The bindings, schemas, MCP tools and CLI options made from the Rust code.
      - name: Check generated files (Linux)
        if: env.NATIVE == 'true' && runner.os == 'Linux'
        run: node scripts/gen.mjs --check

      - name: Paste into Notepad (Windows)
        if: env.NATIVE == 'true' && runner.os == 'Windows'
        run: cargo test -p ibis-desktop --locked one_ctrl_v_pastes_the_clipboard_into_the_app_in_front -- --ignored --nocapture

      - name: Test the scripts (macOS and Windows)
        if: env.SCRIPTS == 'true' && (runner.os == 'Windows' || runner.os == 'macOS')
        run: node scripts/check.mjs --platform-script-tests

      - name: Exercise the native picker (Linux)
        if: ${{ !cancelled() && env.NATIVE == 'true' && steps.native_build.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          /usr/bin/python3 scripts/smoke-native.py --self-test
          /usr/bin/python3 scripts/check-offline.test.py
          for tool in Xvfb xvfb-run xauth dbus-run-session; do command -v "$tool"; done
          # Each layout owns a new server: an exited WM can leave root properties behind.
          for layout in old new missing; do
            IBIS_GTK_CONTROL_TEST=1 GDK_BACKEND=x11 xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- /usr/bin/python3 scripts/update-gtk-probe.test.py --layout "$layout"
          done
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- cargo test -p ibis-desktop --locked gtk_offer_return_declines_and_explicit_install_button_accepts -- --ignored --test-threads=1
          xvfb-run -a -s '-screen 0 1280x800x24' cargo test -p ibis-desktop --locked x11_server_focus_stays_with_editor_during_keyboard_grab -- --ignored --nocapture
          xvfb-run -a -s '-screen 0 1280x800x24' cargo test -p ibis-desktop --locked a_full_screen_active_window_is_detected_from_window_manager_hints -- --ignored --nocapture
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- /usr/bin/python3 scripts/smoke-native.py --app target/debug/ibis-desktop --output screenshots/smoke-Linux
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- /usr/bin/python3 scripts/smoke-native.py --app target/debug/ibis-desktop --output screenshots/preferences-Linux --first-run-preferences

      # Keep native smoke evidence even after a failure or timeout.
      - name: Keep screenshots and startup logs
        if: always() && env.NATIVE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: picker-${{ github.sha }}-${{ runner.os }}
          path: screenshots/*
          if-no-files-found: warn
          retention-days: 14

  # System WebKit rendering is part of daily/manual qualification.
  webkit:
    name: WebKit colours (macOS)
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Build the design canvas
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build:canvas

      - name: Check colours in the system's own WebKit
        run: |
          swiftc -O apps/desktop/gallery/webkit.swift -o "$RUNNER_TEMP/ibis-webkit"
          "$RUNNER_TEMP/ibis-webkit" apps/desktop/dist-canvas webkit-pictures

      - name: Keep the pictures of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-${{ github.sha }}
          path: webkit-pictures/*
          if-no-files-found: warn
          retention-days: 14

  dependencies:
    name: Dependency policy and commit identities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # Only the weekly main run reports advisory failures.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # The privacy guard reads the pull request commit range.

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Public commit identities
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-agent-identity.mjs

      - name: Validate workflow expressions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color -shellcheck= -pyflakes=

      - name: Licenses, bans and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked
          command: check licenses bans sources

      - name: Decide whether advisories block
        id: advisory_policy
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SCHEDULE: ${{ github.event.schedule }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci-advisories.sh policy >> "$GITHUB_OUTPUT"

      - name: RustSec advisories
        id: advisories
        timeout-minutes: 5 # A database outage must leave time to report the warning.
        continue-on-error: true # The next step warns or fails using the path policy.
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked
          command: check advisories

      - name: Report advisory failure
        if: ${{ !cancelled() && steps.advisories.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REF: ${{ github.ref }}
          OUTCOME: ${{ steps.advisories.outcome }}
          BLOCKING: ${{ steps.advisory_policy.outputs.blocking }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/ci-advisories.sh report

  release-checks:
    name: Release checks (Linux)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check release advisories
        if: startsWith(github.ref, 'refs/tags/')
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked
          command: check advisories

      - name: Release-mode, minimum Rust and budgets
        run: bash scripts/ci-release-checks.sh

  bibtex-fuzz:
    name: Damaged BibTeX fuzzing (five minutes)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Compilation and tool setup are outside the five-minute fuzzing budget.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up nightly Rust
        run: rustup toolchain install nightly --profile minimal

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: bibtex-fuzz

      - name: Install cargo-fuzz
        run: cargo +stable install cargo-fuzz --version 0.13.1 --locked

      - name: Test the seed corpus
        run: cargo +nightly test -p ibis-fuzz --locked seed_corpus

      - name: Build the fuzz target
        run: cargo +nightly fuzz build damaged_bibtex --features fuzzing --target-dir target/fuzz

      - name: Fuzz the real BibTeX loader for five minutes
        timeout-minutes: 6
        run: cargo +nightly fuzz run damaged_bibtex --features fuzzing --target-dir target/fuzz -- -max_total_time=300 -timeout=5 -max_len=65536 -rss_limit_mb=2048

      - name: Keep fuzz failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bibtex-fuzz-failures-${{ github.sha }}-${{ github.run_attempt }}
          path: fuzz/artifacts/damaged_bibtex/
          if-no-files-found: ignore
          retention-days: 14

  installed:
    name: Installed journey (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, package: 'Ibis-Linux.*' }
          - { os: macos-15, package: Ibis-macOS-Apple-silicon.dmg }
          - { os: windows-2025, package: Ibis-Windows-setup.exe }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout qualification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify the published nightly
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PACKAGE: ${{ matrix.package }}
        run: |
          sha=$(gh api "repos/$REPO/git/ref/tags/nightly" --jq .object.sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          gh release download nightly --repo "$REPO" --pattern "$PACKAGE" --dir dist
          for file in dist/*; do
            gh attestation verify "$file" --repo "$REPO" --source-ref refs/heads/main --source-digest "$sha" --signer-workflow "$REPO/.github/workflows/preview.yml"
          done
          echo "Installed journey uses nightly $sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Install, exercise and remove the packages
        env:
          IDENTIFIER: com.ibiscite.ibis.nightly
          IBIS_INSTALLED_JOURNEY: '1'
        run: bash scripts/install-and-start.sh

      - name: Keep journey evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-journey-${{ matrix.os }}-${{ github.run_id }}
          path: screenshots/*
          if-no-files-found: warn
          retention-days: 14

  # The only required check, including heavy qualification on daily/manual runs.
  result:
    name: CI result
    if: always()
    needs: [changes, test, web, desktop, webkit, dependencies, release-checks, bibtex-fuzz, installed]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Only for scripts/ci-result.sh, read from the same commit as this workflow.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Require every needed job to pass and main as the base
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.web.result }} ${{ needs.desktop.result }} ${{ needs.dependencies.result }}
          WEB: ${{ needs.changes.outputs.web }}
          NATIVE: ${{ needs.changes.outputs.native }}
          CORE: ${{ needs.changes.outputs.core }}
          INTERFACE: ${{ needs.changes.outputs.interface }}
          TEST: ${{ needs.test.result }}
          WEBKIT: ${{ needs.webkit.result }}
          QUALIFICATION: ${{ needs.release-checks.result }} ${{ needs.bibtex-fuzz.result }} ${{ needs.installed.result }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: scripts/ci-result.sh

  nightly-report:
    name: Report nightly qualification
    needs: result
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Update the qualification report
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RESULT: ${{ needs.result.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/ci-nightly-report.sh
