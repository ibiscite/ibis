name: CI

on:
  push:
    branches: [main]
    # A merge that changes only documentation was already checked on its pull
    # request and cannot change what the build or tests produce.
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

# A newer push replaces the older run of the same branch or pull request. On
# main, the newest commit contains every earlier merge, so its run tests them
# all and the macOS and Windows runners are not kept busy by superseded states.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      native: ${{ steps.classify.outputs.native }}
    steps:
      # A pull request that changes only documentation skips the native app
      # build. The Desktop jobs still run and pass in seconds, so the required
      # checks report. Pushes to main, and anything unclear, build in full.
      - name: Decide whether the native app must be built
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EXPECTED: ${{ github.event.pull_request.changed_files }}
        run: |
          native=true
          if [ "$EVENT" = pull_request ] &&
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)') &&
            listed=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' | wc -l) &&
            [ "$listed" -eq "$EXPECTED" ] && [ "$listed" -gt 0 ]; then
            native=false
            while IFS= read -r file; do
              case "$file" in
                fixtures/*) native=true ;;
                *.md | docs/* | LICENSE* | .github/ISSUE_TEMPLATE/*) ;;
                *) native=true ;;
              esac
            done <<< "$files"
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "Build the native app: $native"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows run the same checks inside their Desktop jobs,
        # which already build on those systems; one runner each per change.
        os: [ubuntu-24.04]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Pull requests restore main's caches but never write their own,
          # which would evict main's from the repository's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --locked

      - name: Test
        run: cargo test --locked

      - name: Test core in release mode (Linux)
        if: runner.os == 'Linux'
        run: cargo test -p ibis-core --release --locked

      - name: Test the declared minimum Rust version (Linux)
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 test --locked

      - name: Script tests
        run: node --test scripts/fuzz.test.mjs scripts/evidence.test.mjs scripts/hygiene.test.mjs scripts/update-feed.test.mjs scripts/release-notes.test.mjs

  web:
    name: Web interface
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NATIVE: ${{ needs.changes.outputs.native }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        if: env.NATIVE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        if: env.NATIVE == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json

      - name: Set up Node.js
        if: env.NATIVE == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install web dependencies
        if: env.NATIVE == 'true'
        run: pnpm install --frozen-lockfile

      - name: Type check and test the interface
        if: env.NATIVE == 'true'
        run: |
          pnpm typecheck
          pnpm test
          pnpm build
          test ! -e dist/gallery.html
          pnpm exec vite build --mode evidence
          test -f dist/gallery.html

      - name: Share the checked web interface
        if: env.NATIVE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-web
          path: apps/desktop/dist
          if-no-files-found: error
          retention-days: 1

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: [changes, web]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      # Only to open or update the issue when native UI smoke fails on main.
      issues: write
    env:
      NATIVE: ${{ needs.changes.outputs.native }}
      # Pull requests run every behaviour check on all three systems. The slow
      # macOS and Windows evidence (all gallery states, appearance changes)
      # runs on main and on manual runs, where it covers each merged change.
      EVIDENCE: ${{ github.event_name != 'pull_request' || matrix.os == 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        # bash stops at the first failing command on every OS; PowerShell on
        # Windows would continue and report only the last command's result.
        shell: bash
    steps:
      - name: Note a documentation-only change
        if: env.NATIVE != 'true'
        run: echo "::notice::Only documentation changed, so the native app was not built or exercised."

      - name: Checkout
        if: env.NATIVE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system WebView libraries (Linux)
        if: env.NATIVE == 'true' && (runner.os == 'Linux')
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf xvfb xauth imagemagick fonts-noto-core fonts-noto-cjk xdotool openbox xterm python3-pyatspi xclip at-spi2-core iproute2 lsof

      - name: Cache Rust build
        if: env.NATIVE == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Pull requests restore main's caches but never write their own,
          # which would evict main's from the repository's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Download the checked web interface
        if: env.NATIVE == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-web
          path: apps/desktop/dist

      - name: Format, lint and test the core (macOS and Windows)
        if: env.NATIVE == 'true' && runner.os != 'Linux'
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked
          cargo test --locked
          node --test scripts/fuzz.test.mjs scripts/evidence.test.mjs scripts/hygiene.test.mjs scripts/release-notes.test.mjs

      - name: Lint, test and build the app
        if: env.NATIVE == 'true'
        id: native_build
        working-directory: .
        run: |
          cargo clippy -p ibis-desktop --all-targets --locked
          cargo test -p ibis-desktop --locked
          # Embed the built interface; a plain debug build uses localhost:5173.
          cargo build -p ibis-desktop --locked --features tauri/custom-protocol

      - name: Capture the picker (Linux and macOS)
        if: env.NATIVE == 'true' && (runner.os != 'Windows')
        working-directory: .
        env:
          IBIS_LIBRARY: ${{ github.workspace }}/fixtures/bibtex/real-world.bib
        run: |
          mkdir -p screenshots
          capture() {
            python3 scripts/check-offline.py --record-baseline screenshots/offline-$RUNNER_OS.json
            target/debug/ibis-desktop > screenshots/startup-$RUNNER_OS.log 2>&1 &
            app_pid=$!
            trap 'kill "$app_pid" 2>/dev/null || true' EXIT
            # Observe startup as well as the delayed background services.
            python3 scripts/check-offline.py --pid "$app_pid" --baseline screenshots/offline-$RUNNER_OS.json --seconds 60
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "::error::The picker exited during startup; see the startup log."
              exit 1
            fi
            if [ "$RUNNER_OS" = Linux ]; then
              import -window root screenshots/picker-Linux.png || echo "::warning::Linux screenshot capture failed."
            else
              screencapture -x screenshots/picker-macOS.png || echo "::warning::macOS screenshot capture failed."
            fi
          }
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash -e -c "$(declare -f capture); capture"
          else
            capture
          fi

      - name: Capture the picker (Windows)
        if: env.NATIVE == 'true' && (runner.os == 'Windows')
        working-directory: .
        shell: pwsh
        env:
          IBIS_LIBRARY: ${{ github.workspace }}/fixtures/bibtex/real-world.bib
        run: |
          ./scripts/check-offline.tests.ps1
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $app = Start-Process target/debug/ibis-desktop.exe -NoNewWindow -PassThru -RedirectStandardOutput screenshots/startup-Windows.log -RedirectStandardError screenshots/stderr-Windows.log
          try {
            # Observe startup as well as delayed WebView2 background services.
            ./scripts/check-offline.ps1 -AppId $app.Id -Seconds 60
            if ($app.HasExited) { throw 'The picker exited during startup; see the startup logs.' }
            try {
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bitmap = [System.Drawing.Bitmap]::new($bounds.Width, $bounds.Height)
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              try {
                $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
                $bitmap.Save("$PWD/screenshots/picker-Windows.png")
              } finally { $graphics.Dispose(); $bitmap.Dispose() }
            } catch { Write-Output "::warning::Windows screenshot capture failed: $($_.Exception.Message)" }
          } finally { if (!$app.HasExited) { Stop-Process -Id $app.Id -Force } }

      - name: Capture every synthetic picker state
        if: ${{ !cancelled() && env.NATIVE == 'true' && env.EVIDENCE == 'true' && steps.native_build.outcome == 'success' }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python -B scripts/test_capture_gallery.py
            python scripts/capture-gallery.py --app target/debug/ibis-desktop.exe --output screenshots/gallery-Windows
          elif [ "$RUNNER_OS" = Linux ]; then
            python3 -B scripts/test_capture_gallery.py
            xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- python3 scripts/capture-gallery.py --app target/debug/ibis-desktop --output screenshots/gallery-Linux
          else
            python3 -B scripts/test_capture_gallery.py
            python3 scripts/capture-gallery.py --app target/debug/ibis-desktop --output screenshots/gallery-macOS
          fi

      - name: Exercise the native picker (Linux)
        if: ${{ !cancelled() && env.NATIVE == 'true' && steps.native_build.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          /usr/bin/python3 scripts/smoke-native.py --self-test
          /usr/bin/python3 scripts/check-offline.test.py
          xvfb-run -a -s '-screen 0 1280x800x24' cargo test -p ibis-desktop --locked x11_server_focus_stays_with_editor_during_keyboard_grab -- --ignored --nocapture
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- /usr/bin/python3 scripts/smoke-native.py --app target/debug/ibis-desktop --output screenshots/smoke-Linux --budgets scripts/smoke-budgets.json

      # macOS and Windows UI automation on hosted runners is the flakiest part
      # of CI (#361, #410). On pull requests it reports a warning instead of
      # blocking the merge; on main a failure is red and opens an issue.
      - name: Exercise the native picker (macOS)
        id: native_macos
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() && env.NATIVE == 'true' && steps.native_build.outcome == 'success' && runner.os == 'macOS' }}
        run: |
          python3 scripts/smoke-native.py --self-test
          python3 scripts/check-offline.test.py
          python3 scripts/smoke-native.py --app target/debug/ibis-desktop --output screenshots/smoke-macOS --budgets scripts/smoke-budgets.json

      - name: Keep failed macOS native diagnostics immediately
        if: always() && env.NATIVE == 'true' && runner.os == 'macOS' && steps.native_macos.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-failure-${{ github.sha }}-macOS
          path: |
            screenshots/smoke-macOS/*.json
            screenshots/smoke-macOS/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Exercise the full-screen macOS panel
        id: native_panel
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() && env.NATIVE == 'true' && steps.native_build.outcome == 'success' && runner.os == 'macOS' }}
        run: |
          python3 scripts/check-panel-macos.py --self-test
          python3 scripts/check-panel-macos.py --app target/debug/ibis-desktop --output screenshots/panel-macOS

      - name: Exercise the native picker (Windows)
        id: native_windows
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() && env.NATIVE == 'true' && steps.native_build.outcome == 'success' && runner.os == 'Windows' }}
        run: |
          python scripts/smoke-native.py --self-test
          python scripts/smoke-native.py --app target/debug/ibis-desktop.exe --output screenshots/smoke-Windows --budgets scripts/smoke-budgets.json

      - name: Observe native materials and accessibility changes (macOS)
        if: ${{ !cancelled() && env.NATIVE == 'true' && env.EVIDENCE == 'true' && steps.native_build.outcome == 'success' && runner.os == 'macOS' }}
        run: |
          python3 -B scripts/test_native_appearance_macos.py
          python3 scripts/check-native-appearance-macos.py --app target/debug/ibis-desktop --output screenshots/appearance-macOS

      - name: Report native UI failures
        if: ${{ !cancelled() && (steps.native_macos.outcome == 'failure' || steps.native_panel.outcome == 'failure' || steps.native_windows.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "::warning title=Native UI smoke failed on $RUNNER_OS::Not blocking this pull request; main runs it again and reports failures in an issue. $RUN_URL"
            exit 0
          fi
          title="Native UI smoke failing on main ($RUNNER_OS)"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          body="Failed on $GITHUB_SHA: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label needs:triage --body "$body"
          fi

      # Uploads still run after a job timeout (which counts as cancelled) so
      # a hang leaves its logs; publishing happens only in the screenshots job.
      - name: Keep screenshots and startup logs
        if: always() && env.NATIVE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: picker-${{ github.sha }}-${{ runner.os }}
          path: screenshots/*
          if-no-files-found: warn
          retention-days: 14

  screenshots:
    name: Collect picker screenshots
    needs: [changes, desktop]
    if: ${{ !cancelled() && needs.changes.outputs.native == 'true' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # GitHub cannot restrict GITHUB_TOKEN to a branch. Keep write permission in
    # this job only, gate all untrusted forks out, and pin pushes in the script.
    permissions:
      contents: write
    steps:
      - name: Checkout evidence publisher
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download native screenshots for publication
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: picker-${{ github.sha }}-*
          path: evidence-input

      - name: Publish synthetic screenshots to evidence
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVIDENCE_SHA: ${{ github.sha }}
          EVIDENCE_INPUT: evidence-input
        run: node scripts/publish-evidence.mjs

      - name: Combine platform artifacts
        uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Preserve earlier outputs on retries and keep them outside the input glob.
          name: picker-combined-${{ github.sha }}-attempt-${{ github.run_attempt }}
          pattern: picker-${{ github.sha }}-*
          retention-days: 14
          delete-merged: true

  fidelity:
    name: Citation fidelity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Pull requests restore main's caches but never write their own,
          # which would evict main's from the repository's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - name: Compare rendering from BibTeX and from CSL export
        env:
          IBIS_REQUIRE_PANDOC: "1"
        run: cargo test -p ibis --test fidelity --locked

  zotero:
    name: Real Zotero
    # Reads what an actual Zotero sends, so a change in Zotero's answers or
    # a wrong assumption about them fails here rather than on a tester's
    # computer. Downloads the current Zotero release from zotero.org.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Zotero's system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libdbus-glib-1-2 libasound2t64 libgtk-3-0t64 libxtst6

      - name: Run the real-Zotero test
        run: scripts/real-zotero.sh

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflow expressions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color -shellcheck= -pyflakes=

      - name: Licenses, advisories, sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked
