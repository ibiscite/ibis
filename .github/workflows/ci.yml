name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
    - cron: "43 5 * * 1" # Weekly full advisory check and one issue on failure.
  workflow_dispatch:

# A newer push replaces a pull request's running check.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Debug information makes up most of what Windows compiles and links here.
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -D warnings

jobs:
  # Which jobs this change can affect (scripts/ci-plan.mjs); anything uncertain,
  # and every main, scheduled or manual run, selects the full suite.
  plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Plan the checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      workspace: ${{ steps.plan.outputs.workspace }}
      pictures: ${{ steps.plan.outputs.pictures }}
      csl: ${{ steps.plan.outputs.csl }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # A pull request's merge commit and the base it merges into.

      - name: Set up Node.js
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Set up pnpm for canvas input discovery
        if: github.event_name == 'pull_request'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Choose the checks
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          SELECTION: ${{ vars.CI_SELECTION }}
          MACOS_RUNNER_OVERRIDE: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && fromJSON(vars.RUNNERS || '{}')['macos-15'] && 'true' || '' }}
          # The runner's own stable Cargo reads the workspace without installing the pinned toolchain.
          RUSTUP_TOOLCHAIN: stable
        run: node scripts/ci-plan.mjs

  interface:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Build the web interface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Build the web interface
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build
          node ../../scripts/picker-budget.mjs dist

      - name: Share the web interface
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-web
          path: apps/desktop/dist
          if-no-files-found: error
          retention-days: 1

  web:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Web interface
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble@sha256:51d31fdfacb0cff99a1a724152e34ae408d2bd4e7da310ff157450f49261cc59
      options: --init
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Choose Ubuntu package cache (web)
        id: apt
        working-directory: .
        run: bash scripts/ci-ubuntu-deps.sh cache-key web >> "$GITHUB_OUTPUT"

      - name: Cache Ubuntu package downloads (web)
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: /var/cache/apt/archives
          key: apt-ubuntu-24.04-web-${{ steps.apt.outputs.key }}

      - name: Script tests
        working-directory: .
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
        run: |
          bash scripts/ci-ubuntu-deps.sh web
          node --test --test-concurrency=2 scripts/*.test.mjs
          for test in scripts/test_*.py scripts/*.test.py; do python3 -B "$test"; done

      - name: Type check and test the interface
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm exec vite build
          node ../../scripts/picker-budget.mjs dist

  pictures:
    needs: plan
    if: needs.plan.outputs.pictures == 'true'
    name: Picture gate
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble@sha256:51d31fdfacb0cff99a1a724152e34ae408d2bd4e7da310ff157450f49261cc59
      options: --init
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Build and render the canvas in WebKit
        run: |
          pnpm -C apps/desktop install --frozen-lockfile
          pnpm -C apps/desktop exec vite build --config vite.canvas.config.ts
          node apps/desktop/gallery/canvas.mjs apps/desktop/dist-canvas picture-actual webkit

      - name: Compare with the visual spec
        run: node apps/desktop/gallery/check-pictures.mjs apps/desktop/gallery/baselines picture-actual picture-diffs

      - name: Keep pictures and diffs of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pictures
          path: |
            picture-actual/*.png
            picture-diffs/*.png
          if-no-files-found: warn
          retention-days: 14

  rust:
    needs: [plan, interface]
    if: needs.plan.outputs.rust == 'true'
    name: Rust and desktop (${{ matrix.os }})
    # RUNNERS can send macOS jobs to our own Mac. Dependabot PRs stay hosted.
    runs-on: ${{ matrix.os == 'macos-15' && github.event.pull_request.user.login != 'dependabot[bot]' && fromJSON(vars.RUNNERS || '{}')['macos-15'] || matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # One job per system: every PR tests all three, and each system takes one
        # runner with one shared build.
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        # bash stops at the first failing command on every OS; PowerShell on
        # Windows would continue and report only the last command's result.
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Windows updater activation contracts
        if: runner.os == 'Windows'
        run: |
          command -v pwsh
          python -B scripts/update-e2e.py --self-test

      - name: Test the Windows offline observer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-offline.tests.ps1

      - name: Prepare Ubuntu package cache (Linux)
        if: runner.os == 'Linux'
        id: apt
        run: |
          sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives
          bash scripts/ci-ubuntu-deps.sh cache-key desktop >> "$GITHUB_OUTPUT"

      - name: Cache Ubuntu package downloads (desktop)
        if: runner.os == 'Linux'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: /var/cache/apt/archives
          key: apt-ubuntu-24.04-desktop-${{ steps.apt.outputs.key }}

      - name: Install system WebView libraries (Linux)
        if: (runner.os == 'Linux')
        working-directory: .
        run: |
          bash scripts/ci-ubuntu-deps.sh desktop
          sudo chmod -R a+rX /var/cache/apt/archives

      - name: Check generated brand assets (Linux)
        if: runner.os == 'Linux'
        run: python3 brand/build.py --check

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      # Only on GitHub's fresh machines: the action restores and prunes
      # CARGO_HOME/bin, which on our Mac would remove the owner's rustup.
      - name: Cache Rust build
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Download the web interface
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-web
          path: apps/desktop/dist

      # Compile every test target first so contract errors report early on every system.
      - name: Lint the workspace
        if: needs.plan.outputs.workspace == 'true'
        run: cargo clippy --all-targets --locked

      - name: Lint the app
        run: cargo clippy -p ibis-desktop -p ibis-desktop-macros --all-targets --locked

      - name: Test
        if: needs.plan.outputs.workspace == 'true'
        run: cargo test --locked

      - name: Test and build the app
        id: native_build
        working-directory: .
        run: |
          cargo test -p ibis-desktop -p ibis-desktop-macros --locked
          # Embed the built interface; a plain debug build uses localhost:5173.
          cargo build -p ibis-desktop --locked --features tauri/custom-protocol

      # Installed only after cargo test: with Pandoc present, cargo test also runs the
      # syntax_contract consumer tests, which fail on Ubuntu's older Pandoc.
      - name: Install Pandoc
        if: runner.os == 'Linux' && needs.plan.outputs.workspace == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - name: Compare rendering from BibTeX and from CSL export
        if: runner.os == 'Linux' && needs.plan.outputs.workspace == 'true'
        env:
          IBIS_REQUIRE_PANDOC: "1"
        run: cargo test -p ibis --test fidelity --locked

      # The bindings, schemas, MCP tools and CLI options made from the Rust code.
      - name: Check generated files (Linux)
        if: runner.os == 'Linux'
        run: node scripts/gen.mjs --check

      - name: Paste into Notepad (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p ibis-desktop --locked one_ctrl_v_pastes_the_clipboard_into_the_app_in_front -- --ignored --nocapture

      - name: Test the scripts (macOS and Windows)
        if: (runner.os == 'Windows' || runner.os == 'macOS')
        run: |
          node --test --test-concurrency=2 scripts/*.test.mjs
          python=python3
          if [ "$RUNNER_OS" = Windows ]; then python=python; fi
          for test in scripts/test_*.py scripts/*.test.py; do "$python" -B "$test"; done

      - name: Exercise the native picker (Linux)
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          /usr/bin/python3 scripts/check-offline.test.py
          for tool in Xvfb xvfb-run xauth dbus-run-session; do command -v "$tool"; done
          # Each layout owns a new server: an exited WM can leave root properties behind.
          for layout in old new missing; do
            IBIS_GTK_CONTROL_TEST=1 GDK_BACKEND=x11 xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- /usr/bin/python3 scripts/update-gtk-probe.test.py --layout "$layout"
          done
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- cargo test -p ibis-desktop --locked gtk_offer_return_declines_and_explicit_install_button_accepts -- --ignored --test-threads=1
          xvfb-run -a -s '-screen 0 1280x800x24' cargo test -p ibis-desktop --locked x11_server_focus_stays_with_editor_during_keyboard_grab -- --ignored --nocapture
          xvfb-run -a -s '-screen 0 1280x800x24' cargo test -p ibis-desktop --locked a_full_screen_active_window_is_detected_from_window_manager_hints -- --ignored --nocapture
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- /usr/bin/python3 scripts/smoke-native.py --app target/debug/ibis-desktop --output screenshots/smoke-Linux
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- /usr/bin/python3 scripts/smoke-native.py --app target/debug/ibis-desktop --output screenshots/preferences-Linux --first-run-preferences

      # Keep native smoke evidence even after a failure or timeout.
      - name: Keep screenshots and startup logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: picker-${{ github.sha }}-${{ runner.os }}
          path: screenshots/*
          if-no-files-found: warn
          retention-days: 14

  # System WebKit rendering is part of daily/manual qualification.
  webkit:
    name: WebKit colours (macOS)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Build the design canvas
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build:canvas

      - name: Check colours in the system's own WebKit
        run: |
          swiftc -O apps/desktop/gallery/webkit.swift -o "$RUNNER_TEMP/ibis-webkit"
          "$RUNNER_TEMP/ibis-webkit" apps/desktop/dist-canvas webkit-pictures

      - name: Keep the pictures of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-${{ github.sha }}
          path: webkit-pictures/*
          if-no-files-found: warn
          retention-days: 14

  dependencies:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Dependency policy and commit identities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # Only the weekly main run reports advisory failures.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # The privacy guard reads the pushed commit range.

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Public commit identities
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/check-agent-identity.mjs

      - name: Validate workflow expressions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color -shellcheck= -pyflakes=

      - name: Licenses, bans and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked
          command: check licenses bans sources

      - name: Decide whether advisories block
        id: advisory_policy
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SCHEDULE: ${{ github.event.schedule }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci-advisories.sh policy >> "$GITHUB_OUTPUT"

      - name: RustSec advisories
        id: advisories
        timeout-minutes: 5 # A database outage must leave time to report the warning.
        continue-on-error: true # The next step warns or fails using the path policy.
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked
          command: check advisories

      - name: Report advisory failure
        if: ${{ !cancelled() && steps.advisories.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REF: ${{ github.ref }}
          OUTCOME: ${{ steps.advisories.outcome }}
          BLOCKING: ${{ steps.advisory_policy.outputs.blocking }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/ci-advisories.sh report

  release-checks:
    needs: plan
    if: needs.plan.outputs.workspace == 'true'
    name: Release checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check release advisories
        if: startsWith(github.ref, 'refs/tags/')
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked
          command: check advisories

      - name: Release-mode, minimum Rust and budgets
        run: bash scripts/ci-release-checks.sh

  # Every parser in docs/threat-model.md, fuzzed for two minutes each. The
  # corpus each night grows is kept in the cache for the next night.
  fuzz:
    name: Parser fuzzing (two minutes each)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Compilation and tool setup are outside the fuzzing budgets.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up nightly Rust
        run: rustup toolchain install nightly --profile minimal

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: parser-fuzz

      - name: Restore the grown corpus
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: fuzz/cached-corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-

      - name: Install cargo-fuzz
        run: cargo +stable install cargo-fuzz --version 0.13.1 --locked

      - name: Test the seed corpus
        run: cargo +nightly test -p ibis-fuzz --locked

      - name: Build the fuzz targets
        run: cargo +nightly fuzz build --features fuzzing --target-dir target/fuzz

      # New inputs go to the cached corpus; the committed seeds stay as they are.
      - name: Fuzz every parser
        timeout-minutes: 25
        run: |
          status=0
          for file in fuzz/fuzz_targets/*.rs; do
            target=$(basename "$file" .rs)
            max_len=65536
            if [ "$target" = damaged_pdf ]; then max_len=1048576; fi
            mkdir -p "fuzz/cached-corpus/$target"
            echo "::group::$target"
            if ! cargo +nightly fuzz run "$target" --features fuzzing --target-dir target/fuzz \
                "fuzz/cached-corpus/$target" "fuzz/corpus/$target" -- \
                -max_total_time=120 -timeout=5 -max_len="$max_len" -rss_limit_mb=2048; then
              status=1
              echo "::error::Fuzzing $target found a failure; its input is in the fuzz-failures artifact."
            fi
            echo "::endgroup::"
          done
          exit "$status"

      - name: Keep fuzz failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures-${{ github.sha }}-${{ github.run_attempt }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  installed:
    name: Installed journey (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, package: 'Ibis-Linux.*' }
          - { os: macos-15, package: Ibis-macOS-Apple-silicon.dmg }
          - { os: windows-2025, package: Ibis-Windows-setup.exe }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout qualification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify the published nightly
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PACKAGE: ${{ matrix.package }}
        run: |
          sha=$(gh api "repos/$REPO/git/ref/tags/nightly" --jq .object.sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          gh release download nightly --repo "$REPO" --pattern "$PACKAGE" --dir dist
          for file in dist/*; do
            gh attestation verify "$file" --repo "$REPO" --source-ref refs/heads/main --source-digest "$sha" --signer-workflow "$REPO/.github/workflows/preview.yml"
          done
          echo "Installed journey uses nightly $sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Install, exercise and remove the packages
        env:
          IDENTIFIER: com.ibiscite.ibis.nightly
          IBIS_INSTALLED_JOURNEY: '1'
        run: bash scripts/install-and-start.sh

      - name: Keep journey evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-journey-${{ matrix.os }}-${{ github.run_id }}
          path: screenshots/*
          if-no-files-found: warn
          retention-days: 14

  conformance:
    needs: plan
    if: needs.plan.outputs.csl == 'true'
    name: CSL test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Fetch the pinned CSL test suite
        run: node scripts/csl-suite.mjs

      - name: Run it through the shipped formatter
        run: cargo test --locked -p ibis-csl --lib conformance -- --ignored

  # The required merge check and publication evidence; daily/manual runs add
  # qualification. A fork's PR skips every job above, so its result fails.
  result:
    name: CI result
    if: always()
    needs: [plan, interface, rust, web, pictures, webkit, dependencies, release-checks, fuzz, installed, conformance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Only for scripts/ci-result.sh, read from the same commit as this workflow.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Require every CI job to pass
        env:
          RESULTS: ${{ needs.plan.result }} ${{ needs.interface.result }} ${{ needs.web.result }} ${{ needs.dependencies.result }}
          # Each planned job as name:selected:result; see scripts/ci-result.sh.
          SELECTED: rust:${{ needs.plan.outputs.rust }}:${{ needs.rust.result }} pictures:${{ needs.plan.outputs.pictures }}:${{ needs.pictures.result }} csl:${{ needs.plan.outputs.csl }}:${{ needs.conformance.result }} release:${{ needs.plan.outputs.workspace }}:${{ needs.release-checks.result }}
          WORKSPACE: ${{ needs.plan.outputs.workspace }}
          QUALIFICATION: ${{ needs.webkit.result }} ${{ needs.fuzz.result }} ${{ needs.installed.result }}
          EVENT: ${{ github.event_name }}
        run: scripts/ci-result.sh

  nightly-report:
    name: Report nightly qualification
    needs: result
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Update the qualification report
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RESULT: ${{ needs.result.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/ci-nightly-report.sh
