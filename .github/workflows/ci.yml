name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# On a pull request, a newer push cancels the run in progress. On main, a run
# that has started always finishes, so its caches are saved and its evidence is
# collected; GitHub keeps only the newest waiting push and replaces older ones
# before they start, so a burst of merges never runs every commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.classify.outputs.native }}
      web: ${{ steps.classify.outputs.web }}
    steps:
      # Interface-only and website-only pull requests keep web validation
      # without native jobs and without building the interface for them.
      # A Linux Desktop placeholder still reports success for "CI result".
      # Main and unclear file lists build the complete app.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide which app checks must run
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EXPECTED: ${{ github.event.pull_request.changed_files }}
          EXPECTED_REFS: ${{ github.event.pull_request.head.sha }}:${{ github.event.pull_request.base.sha }}
        run: |
          # Pin the API list to this event's head and base across pagination.
          # Failed reads, changed refs or a partial list enable every check.
          unset FILES
          if [ "$EVENT" = pull_request ] &&
            before=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha + ":" + .base.sha') && [ "$before" = "$EXPECTED_REFS" ] &&
            gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | {filename, previous_filename, status} | @json' > "$RUNNER_TEMP/changed-files.ndjson" &&
            after=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha + ":" + .base.sha') && [ "$after" = "$EXPECTED_REFS" ]; then
            export FILES="$RUNNER_TEMP/changed-files.ndjson"
          fi
          node scripts/ci-paths.mjs | tee -a "$GITHUB_OUTPUT"

      # Desktop embeds the interface built here, so it starts as soon as the
      # files are classified instead of after every Web interface check. That
      # job checks the same commit, and "CI result" needs both.
      - name: Set up Node.js
        if: steps.classify.outputs.native == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up pnpm
        if: steps.classify.outputs.native == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Build the web interface
        if: steps.classify.outputs.native == 'true'
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build
          node ../../scripts/picker-budget.mjs dist

      - name: Share the web interface
        if: steps.classify.outputs.native == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-web
          path: apps/desktop/dist
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows run the same checks inside their Desktop jobs,
        # which already build on those systems; one runner each per change.
        os: [ubuntu-24.04]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Pull requests restore main's caches but never write their own,
          # which would evict main's from the repository's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --locked

      - name: Test
        run: cargo test --locked

      - name: Enforce 100k search budget (release)
        # Compilation and the ordinary test processes finish before measurement;
        # this binary runs alone, with its first search retained in the samples.
        run: cargo test -p ibis-engine --locked --release --test refresh_budget -- search_budget --ignored --nocapture --test-threads=1

  web:
    name: Web interface
    needs: changes
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble@sha256:51d31fdfacb0cff99a1a724152e34ae408d2bd4e7da310ff157450f49261cc59
      options: --init
    timeout-minutes: 10
    env:
      WEB: ${{ needs.changes.outputs.web }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      # Checkout and install always run: the script tests below need the
      # interface and some read Markdown (docs/design.md), so they run even on
      # a documentation-only change.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Identity guard checks the PR range and merge-group candidate.

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      # Every script test, as scripts/check.mjs runs them locally.
      - name: Script tests and public commit identities
        working-directory: .
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
        run: |
          node scripts/check.mjs --script-tests

      - name: Type check and test the interface
        if: env.WEB == 'true'
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
          node ../../scripts/picker-budget.mjs dist

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      NATIVE: ${{ needs.changes.outputs.native }}
    strategy:
      fail-fast: false
      matrix:
        # Without native inputs only a Linux placeholder reports, so a docs or
        # interface change never waits for macOS or Windows runners.
        os: ${{ needs.changes.outputs.native == 'true' && fromJSON('["ubuntu-24.04", "macos-15", "windows-2025"]') || fromJSON('["ubuntu-24.04"]') }}
    defaults:
      run:
        # bash stops at the first failing command on every OS; PowerShell on
        # Windows would continue and report only the last command's result.
        shell: bash
    steps:
      - name: Note a change without native checks
        if: env.NATIVE != 'true'
        run: echo "::notice::No native inputs changed; native checks run on main."

      - name: Checkout
        if: env.NATIVE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Windows updater activation contracts
        if: env.NATIVE == 'true' && runner.os == 'Windows'
        run: |
          command -v pwsh
          python -B scripts/update-e2e.py --self-test

      - name: Test the Windows offline observer
        if: env.NATIVE == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-offline.tests.ps1

      - name: Install system WebView libraries (Linux)
        if: env.NATIVE == 'true' && (runner.os == 'Linux')
        working-directory: .
        run: |
          # Prefer the HTTPS archive already configured by runner-images (#857).
          sudo python3 - <<'PY'
          from pathlib import Path

          path = Path("/etc/apt/apt-mirrors.txt")
          archive = "https://archive.ubuntu.com/ubuntu/"
          lines = path.read_text().splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if line.split()[:1] == [archive]]
          if len(matches) != 1 or lines[matches[0]].split() not in (
              [archive, "priority:2"], [archive, "priority:0"]
          ):
              raise SystemExit("expected runner archive mirror is missing or ambiguous")
          lines[matches[0]] = f"{archive}\tpriority:0\n"
          path.write_text("".join(lines))
          PY
          # Match runner-images' acquire bounds even on images with older defaults (#857).
          ibis_apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          sudo apt-get "${ibis_apt_options[@]}" update
          sudo apt-get "${ibis_apt_options[@]}" install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev librsvg2-bin fonts-inter libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf xvfb xauth imagemagick fonts-noto-core fonts-noto-cjk xdotool x11-utils openbox xterm python3-pyatspi xclip at-spi2-core iproute2 lsof

      - name: Check generated brand assets (Linux)
        if: env.NATIVE == 'true' && runner.os == 'Linux'
        run: node scripts/check.mjs --brand-assets

      - name: Cache Rust build
        if: env.NATIVE == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Pull requests restore main's caches but never write their own,
          # which would evict main's from the repository's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Download the web interface
        if: env.NATIVE == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-web
          path: apps/desktop/dist

      - name: Lint and test the core and scripts (macOS and Windows)
        if: env.NATIVE == 'true' && runner.os != 'Linux'
        run: |
          cargo clippy --all-targets --locked
          cargo test --locked
          node scripts/check.mjs --platform-script-tests

      - name: Lint, test and build the app
        if: env.NATIVE == 'true'
        id: native_build
        working-directory: .
        run: |
          cargo clippy -p ibis-desktop --all-targets --locked
          cargo test -p ibis-desktop --locked
          # Embed the built interface; a plain debug build uses localhost:5173.
          cargo build -p ibis-desktop --locked --features tauri/custom-protocol

      - name: Exercise the native picker (Linux)
        if: ${{ !cancelled() && env.NATIVE == 'true' && steps.native_build.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          /usr/bin/python3 scripts/smoke-native.py --self-test
          /usr/bin/python3 scripts/check-offline.test.py
          xvfb-run -a -s '-screen 0 1280x800x24' cargo test -p ibis-desktop --locked x11_server_focus_stays_with_editor_during_keyboard_grab -- --ignored --nocapture
          xvfb-run -a -s '-screen 0 1280x800x24' cargo test -p ibis-desktop --locked a_full_screen_active_window_is_detected_from_window_manager_hints -- --ignored --nocapture
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- /usr/bin/python3 scripts/smoke-native.py --app target/debug/ibis-desktop --output screenshots/smoke-Linux
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- /usr/bin/python3 scripts/smoke-native.py --app target/debug/ibis-desktop --output screenshots/preferences-Linux --first-run-preferences

      # Keep native smoke evidence even after a failure or timeout.
      - name: Keep screenshots and startup logs
        if: always() && env.NATIVE == 'true' && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: picker-${{ github.sha }}-${{ runner.os }}
          path: screenshots/*
          if-no-files-found: warn
          retention-days: 14

  fidelity:
    name: Citation fidelity
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Pull requests restore main's caches but never write their own,
          # which would evict main's from the repository's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - name: Compare rendering from BibTeX and from CSL export
        env:
          IBIS_REQUIRE_PANDOC: "1"
        run: cargo test -p ibis --test fidelity --locked

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflow expressions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color -shellcheck= -pyflakes=

      - name: Licenses, advisories, sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked

  # One check that stands for every required job, for the ruleset to require
  # instead of six names. A matrix job skipped because a job it needs failed
  # never reports its per-system checks; this job always reports. Every
  # unconditional job must succeed. Rust and fidelity may be skipped only for
  # docs-only inputs; missing classifier output fails shut.
  # It also refuses stacked pull requests: every pull request targets main.
  result:
    name: CI result
    if: always()
    needs: [changes, test, web, desktop, fidelity, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every needed job to pass and main as the base
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.web.result }} ${{ needs.desktop.result }} ${{ needs.dependencies.result }}
          WEB: ${{ needs.changes.outputs.web }}
          NATIVE: ${{ needs.changes.outputs.native }}
          RUST_RESULTS: ${{ needs.test.result }} ${{ needs.fidelity.result }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          echo "Results: $RESULTS"
          if [ "$EVENT" = pull_request ] && [ "$BASE" != main ]; then
            echo "::error::This pull request targets '$BASE'. Stacked pull requests are not allowed: retarget it to main."
            exit 1
          fi
          set -- $RESULTS
          if [ "$#" -ne 4 ]; then
            echo "::error::Expected 4 unconditional job results, got $#."
            exit 1
          fi
          for result in "$@"; do
            if [ "$result" != success ]; then
              echo "::error::A required job ended '$result'."
              exit 1
            fi
          done
          case "$EVENT:$WEB:$NATIVE" in
            pull_request:false:false) expected=skipped ;;
            pull_request:true:false|*:true:true) expected=success ;;
            *) echo "::error::Missing or invalid check selection."; exit 1 ;;
          esac
          set -- $RUST_RESULTS
          if [ "$#" -ne 2 ]; then
            echo "::error::Expected 2 Rust job results, got $#."
            exit 1
          fi
          for result in "$@"; do
            if [ "$result" != "$expected" ]; then
              echo "::error::Expected Rust and fidelity jobs to be '$expected', got '$result'."
              exit 1
            fi
          done
