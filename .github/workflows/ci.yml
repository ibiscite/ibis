name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  # Pushes to main reuse the queue's run, so this daily run on main is what
  # notices time-dependent breakage (new advisories, runner images) and keeps
  # main's caches from expiring.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

# On a pull request, a newer push cancels the run in progress. On main, a run
# that has started always finishes, so its caches are saved and its evidence is
# collected; GitHub keeps only the newest waiting push and replaces older ones
# before they start, so a burst of merges never runs every commit. Each merge
# queue entry has its own ref and group, and is never cancelled.
#
# Each change is checked twice at most: on its pull request and in the merge
# queue. A queue entry that holds exactly the tree its pull request's passing
# run checked, and changes no crate or script (whose macOS tests pull requests
# leave to the queue), reuses that run; so does a push to main of the commit
# the queue checked (scripts/ci-changes.sh). Main runs everything only when its
# caches' inputs changed, so it saves new caches.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Debug information makes up most of what Windows compiles and links here.
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -D warnings

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Reads which CI runs passed, to reuse a run that checked the same tree.
      actions: read
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.classify.outputs.core }}
      interface: ${{ steps.classify.outputs.interface }}
      native: ${{ steps.classify.outputs.native }}
      proven: ${{ steps.classify.outputs.proven }}
      scripts: ${{ steps.classify.outputs.scripts }}
      web: ${{ steps.classify.outputs.web }}
    steps:
      # Interface-only and website-only changes keep web validation
      # without native jobs and without building the interface for them.
      # A Linux Desktop placeholder still reports success for "CI result".
      # Script-only changes add their tests on Windows (and macOS outside
      # pull requests) without building the app. Changes only inside
      # apps/desktop skip the crates' tests. Unclear file lists build everything.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide which app checks must run
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EXPECTED: ${{ github.event.pull_request.changed_files }}
          EXPECTED_REFS: ${{ github.event.pull_request.head.sha }}:${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref || github.event.merge_group.head_ref }}
          ACTOR: ${{ github.triggering_actor }}
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: scripts/ci-changes.sh

      # Desktop embeds the interface built here, so it starts as soon as the
      # files are classified instead of after every Web interface check. That
      # job checks the same commit, and "CI result" needs both.
      - name: Set up Node.js
        if: steps.classify.outputs.native == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up pnpm
        if: steps.classify.outputs.native == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Build the web interface
        if: steps.classify.outputs.native == 'true'
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build
          node ../../scripts/picker-budget.mjs dist

      - name: Share the web interface
        if: steps.classify.outputs.native == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-web
          path: apps/desktop/dist
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test (ubuntu-24.04)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests restore main's caches but never write their own,
          # which would evict main's from the repository's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint
        run: cargo clippy --all-targets --locked

      - name: Check the declared minimum Rust version
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 check --locked --all-targets

      - name: Test
        run: cargo test --locked

      # Installed only now: with Pandoc present, cargo test also runs the
      # syntax_contract consumer tests, which fail on Ubuntu's older Pandoc.
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - name: Compare rendering from BibTeX and from CSL export
        env:
          IBIS_REQUIRE_PANDOC: "1"
        run: cargo test -p ibis --test fidelity --locked

      - name: Enforce 100k search budget (release)
        # Compilation and the ordinary test processes finish before measurement;
        # this binary runs alone, with its first search retained in the samples.
        run: cargo test -p ibis-engine --locked --release --test refresh_budget -- search_budget --ignored --nocapture --test-threads=1

  web:
    name: Web interface
    needs: changes
    if: needs.changes.outputs.proven != 'true'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble@sha256:51d31fdfacb0cff99a1a724152e34ae408d2bd4e7da310ff157450f49261cc59
      options: --init
    timeout-minutes: 10
    env:
      WEB: ${{ needs.changes.outputs.web }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      # Checkout and install always run: the script tests below need the
      # interface and some read Markdown (docs/design/), so they run even on
      # a documentation-only change.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      # Every script test, as scripts/check.mjs runs them locally.
      - name: Script tests
        working-directory: .
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
        run: |
          # The workflow policy test reads ci.yml with PyYAML (Ubuntu's own package).
          if ! python3 -c 'import yaml' 2>/dev/null; then
            apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-yaml
          fi
          node scripts/check.mjs --script-tests

      - name: Type check and test the interface
        if: env.WEB == 'true'
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm exec vite build
          node ../../scripts/picker-budget.mjs dist

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.proven != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CORE: ${{ needs.changes.outputs.core }}
      NATIVE: ${{ needs.changes.outputs.native }}
      SCRIPTS: ${{ needs.changes.outputs.scripts }}
    strategy:
      fail-fast: false
      matrix:
        # Without native inputs only a Linux placeholder reports, so a docs or
        # interface change never waits for macOS or Windows runners. Script
        # changes add Windows, and macOS outside pull requests, for their tests.
        os: >-
          ${{ (needs.changes.outputs.native == 'true' || (needs.changes.outputs.scripts == 'true' && github.event_name != 'pull_request'))
          && fromJSON('["ubuntu-24.04", "macos-15", "windows-2025"]')
          || needs.changes.outputs.scripts == 'true' && fromJSON('["ubuntu-24.04", "windows-2025"]')
          || fromJSON('["ubuntu-24.04"]') }}
    defaults:
      run:
        # bash stops at the first failing command on every OS; PowerShell on
        # Windows would continue and report only the last command's result.
        shell: bash
    steps:
      - name: Note a change without native checks
        if: env.NATIVE != 'true'
        run: echo "::notice::No native inputs changed, so the app is not built here."

      - name: Checkout
        if: env.NATIVE == 'true' || env.SCRIPTS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Windows updater activation contracts
        if: env.CORE == 'true' && runner.os == 'Windows'
        run: |
          command -v pwsh
          python -B scripts/update-e2e.py --self-test

      - name: Test the Windows offline observer
        if: env.CORE == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-offline.tests.ps1

      - name: Install system WebView libraries (Linux)
        if: env.NATIVE == 'true' && (runner.os == 'Linux')
        working-directory: .
        run: scripts/ci-linux-webview.sh

      - name: Check generated brand assets (Linux)
        if: env.NATIVE == 'true' && runner.os == 'Linux'
        run: node scripts/check.mjs --brand-assets

      - name: Format
        if: env.NATIVE == 'true' && runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Cache Rust build
        if: env.NATIVE == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests restore main's caches but never write their own,
          # which would evict main's from the repository's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Download the web interface
        if: env.NATIVE == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-web
          path: apps/desktop/dist

      # Compile desktop test targets before unrelated suites so contract errors
      # report early on every native platform.
      - name: Lint all desktop targets
        if: env.NATIVE == 'true'
        run: cargo clippy -p ibis-desktop --all-targets --locked

      - name: Lint, test and build the app
        if: env.NATIVE == 'true'
        id: native_build
        working-directory: .
        run: |
          cargo test -p ibis-desktop --locked
          # Embed the built interface; a plain debug build uses localhost:5173.
          cargo build -p ibis-desktop --locked --features tauri/custom-protocol

      - name: Paste into Notepad (Windows)
        if: env.NATIVE == 'true' && runner.os == 'Windows'
        run: cargo test -p ibis-desktop --locked one_ctrl_v_pastes_the_clipboard_into_the_app_in_front -- --ignored --nocapture

      # The whole journey into TextEdit and a terminal (scripts/smoke-native.py
      # --journey). Exit 2 means this runner could not grant what it needs.
      - name: Journey into TextEdit (macOS)
        if: ${{ !cancelled() && env.NATIVE == 'true' && steps.native_build.outcome == 'success' && runner.os == 'macOS' }}
        run: |
          status=0
          python3 scripts/smoke-native.py --journey --app target/debug/ibis-desktop --output screenshots/journey-macOS || status=$?
          if [ "$status" = 2 ]; then echo "::warning::The macOS journey was unavailable on this runner."; exit 0; fi
          exit "$status"

      # Windows finds real bugs in the crates. macOS almost never finds one
      # that Linux misses, so pull requests leave it to the merge queue.
      - name: Lint and test the core (macOS and Windows)
        if: env.CORE == 'true' && (runner.os == 'Windows' || (runner.os == 'macOS' && github.event_name != 'pull_request'))
        run: |
          cargo clippy --all-targets --locked
          cargo test --locked

      - name: Test the scripts (macOS and Windows)
        if: env.SCRIPTS == 'true' && (runner.os == 'Windows' || (runner.os == 'macOS' && github.event_name != 'pull_request'))
        run: node scripts/check.mjs --platform-script-tests

      - name: Exercise the native picker (Linux)
        if: ${{ !cancelled() && env.NATIVE == 'true' && steps.native_build.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          /usr/bin/python3 scripts/smoke-native.py --self-test
          /usr/bin/python3 scripts/check-offline.test.py
          for tool in Xvfb xvfb-run xauth dbus-run-session; do command -v "$tool"; done
          # Each layout owns a new server: an exited WM can leave root properties behind.
          for layout in old new missing; do
            IBIS_GTK_CONTROL_TEST=1 GDK_BACKEND=x11 xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- /usr/bin/python3 scripts/update-gtk-probe.test.py --layout "$layout"
          done
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- cargo test -p ibis-desktop --locked gtk_offer_return_declines_and_explicit_install_button_accepts -- --ignored --test-threads=1
          xvfb-run -a -s '-screen 0 1280x800x24' cargo test -p ibis-desktop --locked x11_server_focus_stays_with_editor_during_keyboard_grab -- --ignored --nocapture
          xvfb-run -a -s '-screen 0 1280x800x24' cargo test -p ibis-desktop --locked a_full_screen_active_window_is_detected_from_window_manager_hints -- --ignored --nocapture
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- /usr/bin/python3 scripts/smoke-native.py --app target/debug/ibis-desktop --output screenshots/smoke-Linux
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- /usr/bin/python3 scripts/smoke-native.py --app target/debug/ibis-desktop --output screenshots/preferences-Linux --first-run-preferences

      # Keep native smoke evidence even after a failure or timeout.
      - name: Keep screenshots and startup logs
        if: always() && env.NATIVE == 'true' && runner.os != 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: picker-${{ github.sha }}-${{ runner.os }}
          path: screenshots/*
          if-no-files-found: warn
          retention-days: 14

  # jsdom and Chromium show neither WebKit's system colours nor its light-dark().
  # Interface changes skip the macOS Desktop job, so this one runs by itself.
  webkit:
    name: WebKit colours (macOS)
    needs: changes
    if: needs.changes.outputs.interface == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Build the design canvas
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build:canvas

      - name: Check colours in the system's own WebKit
        run: |
          swiftc -O apps/desktop/gallery/webkit.swift -o "$RUNNER_TEMP/ibis-webkit"
          "$RUNNER_TEMP/ibis-webkit" apps/desktop/dist-canvas webkit-pictures

      - name: Keep the pictures of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-${{ github.sha }}
          path: webkit-pictures/*
          if-no-files-found: warn
          retention-days: 14

  # Every run needs this job, a reused one included: a queue entry's squash
  # commit carries metadata (the pull request's text as its message) that no
  # earlier run saw, and the identity guard reads it.
  dependencies:
    name: Dependency policy and commit identities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # The identity guard reads the pull request range or the queue candidate.

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Public commit identities
        run: node scripts/check-agent-identity.mjs

      - name: Validate workflow expressions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color -shellcheck= -pyflakes=

      - name: Licenses, advisories, sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked

  # One check that stands for every required job, for the ruleset to require
  # instead of six names. A matrix job skipped because a job it needs failed
  # never reports its per-system checks; this job always reports. Every
  # unconditional job must succeed. Test and WebKit may be skipped only when
  # their inputs did not change, and Web and Desktop only when a passing run
  # already checked this exact tree; missing classifier output fails shut.
  # It also refuses stacked pull requests: every pull request targets main.
  result:
    name: CI result
    if: always()
    needs: [changes, test, web, desktop, webkit, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Only for scripts/ci-result.sh, read from the same commit as this workflow.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Require every needed job to pass and main as the base
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.web.result }} ${{ needs.desktop.result }} ${{ needs.dependencies.result }}
          WEB: ${{ needs.changes.outputs.web }}
          NATIVE: ${{ needs.changes.outputs.native }}
          CORE: ${{ needs.changes.outputs.core }}
          INTERFACE: ${{ needs.changes.outputs.interface }}
          PROVEN: ${{ needs.changes.outputs.proven }}
          TEST: ${{ needs.test.result }}
          WEBKIT: ${{ needs.webkit.result }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: scripts/ci-result.sh
