name: Syntax tools

# Runs what Ibis writes through each key syntax's own tool (#1207). The tools are
# large, so this runs only when a syntax can have changed. Nothing here is signed
# or published, and no secret is available to the steps.

on:
  pull_request:
    paths:
      - crates/ibis-core/src/syntax/**
      - crates/ibis-core/src/contract/citation.rs
      - fixtures/syntax-tools/**
      - scripts/syntax-tools.mjs
      - .github/workflows/syntax-tools.yml
  push:
    branches: [main]
    paths:
      - crates/ibis-core/src/syntax/**
      - fixtures/syntax-tools/**
      - scripts/syntax-tools.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    name: Key syntaxes in their own tools
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends context libtext-multimarkdown-perl ruby-dev build-essential
          sudo mtxrun --generate
          python3 -m pip install --user 'sphinx==8.2.3' 'myst-parser==4.0.1' 'sphinxcontrib-bibtex==2.6.5' 'nbconvert==7.16.6'
          sudo gem install --no-document asciidoctor:2.0.23 asciidoctor-bibtex:0.9.0 jekyll:4.4.1 jekyll-scholar:7.2.0
      - name: Build ibis
        run: cargo build -p ibis --locked
      - name: Check each syntax in its own tool
        run: node scripts/syntax-tools.mjs --require
