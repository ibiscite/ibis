name: Nightly fuzzing

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-fuzzing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target: [split_parse, load_str, csl_export]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly and cargo-fuzz (app toolchain stays pinned)
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install --locked cargo-fuzz --version 0.13.1

      - name: Restore corpus from the previous nightly run
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-v1-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-v1-${{ matrix.target }}-

      - name: Fuzz, minimize and report new failures
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fuzz.mjs ${{ matrix.target }}

      - name: Save corpus even when a failure was found
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-v1-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve failure logs and original and minimized inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_id }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/
            fuzz/results/${{ matrix.target }}/
          retention-days: 30
          if-no-files-found: warn
