name: Nightly metamorphic tests

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metamorphic-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  metamorphic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Exercise more equivalent libraries
        shell: bash
        env:
          IBIS_METAMORPHIC_CASES: "2048"
        run: |
          set -o pipefail
          cargo test -p ibis-core --test metamorphic --locked -- --nocapture 2>&1 | tee metamorphic.log

      - name: Preserve failure seeds and minimized examples
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metamorphic-failures
          path: |
            metamorphic.log
            **/*.proptest-regressions
            **/proptest-regressions/**
          retention-days: 14
