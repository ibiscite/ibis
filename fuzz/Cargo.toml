[package]
name = "ibis-fuzz"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[package.metadata]
cargo-fuzz = true

[features]
fuzzing = ["dep:libfuzzer-sys"]

[dependencies]
ibis = { path = "../crates/ibis-cli" }
ibis-core = { path = "../crates/ibis-core" }
ibis-engine = { path = "../crates/ibis-engine" }
ibis-sources = { path = "../crates/ibis-sources", features = ["endnote"] }
libfuzzer-sys = { version = "=0.4.13", optional = true }
serde_json = "1.0.154"
tempfile = "3.27.0"

[[bin]]
name = "damaged_bibtex"
path = "fuzz_targets/damaged_bibtex.rs"
required-features = ["fuzzing"]
test = false
doc = false
bench = false

