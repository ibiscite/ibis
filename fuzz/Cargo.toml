[package]
name = "ibis-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "AGPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
ibis-core = { path = "../crates/ibis-core" }
serde_json = "1.0.154"

[[bin]]
name = "split_parse"
path = "fuzz_targets/split_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "load_str"
path = "fuzz_targets/load_str.rs"
test = false
doc = false
bench = false

[[bin]]
name = "csl_export"
path = "fuzz_targets/csl_export.rs"
test = false
doc = false
bench = false
[[bin]]
name = "cite_render"
path = "fuzz_targets/cite_render.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zotero_payload"
path = "fuzz_targets/zotero_payload.rs"
test = false
doc = false
bench = false

[lints]
workspace = true

[[bin]]
name = "bibtex_inheritance"
path = "fuzz_targets/bibtex_inheritance.rs"
test = false
doc = false
bench = false
