[workspace]
resolver = "3"
members = ["crates/ibis-core", "crates/ibis-cli", "crates/ibis-zotero-local", "apps/desktop/src-tauri", "fuzz"]
# The desktop app needs system WebView libraries to build; plain `cargo test`
# covers the core and command line tool. CI builds the app separately;
# cargo-fuzz selects the fuzz package explicitly with nightly instrumentation.
default-members = ["crates/ibis-core", "crates/ibis-cli", "crates/ibis-zotero-local"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ibiscite/ibis"
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"

# Debug builds run the native smoke and performance checks in CI. Optimizing
# dependencies and the parse/index crate brings the 100k library path near
# release speed while keeping debug assertions and overflow checks (#9).
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.ibis-core]
opt-level = 2
