[package]
name = "ibis-desktop"
description = "Ibis desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
ibis-core = { path = "../../../crates/ibis-core", features = ["type-export"] }
ibis-engine = { path = "../../../crates/ibis-engine" }
ibis-zotero-local = { path = "../../../crates/ibis-zotero-local" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-single-instance = "2.3"
# Signed opt-in updates (ADR 0019). Without the default `zip` feature: updates
# are the plain installer, AppImage or macOS app archive, never a zip file.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }

# Already locked through Tauri/global-hotkey. Query X11's actual input owner
# because a passive shortcut grab can leave GTK's active flag stale.
[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6.2"
# Already locked through Tauri. Consume the portal's one-use Wayland focus token
# using GTK's safe window API; never an environment variable or a WebView event.
gtk = "0.18.2"
# Already locked through Tauri; bounded local session-bus portal calls.
zbus = "5.19.0"
tokio = { version = "1.52", features = ["time"] }
x11rb = { version = "0.14.0", default-features = false, features = ["xkb"] }

# #198: normal windows cannot enter another app's full-screen Space. This
# macOS-only adapter provides NSPanel conversion without unsafe app code.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "=2.1.1"
# Safe AppKit bindings for workspace, appearance, events and the clipboard.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "libc", "NSAccessibility", "NSColor", "NSColorSpace", "NSEvent", "NSPasteboard", "NSApplication", "NSView", "NSWindow", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSImage", "objc2-core-graphics"] }
# Already locked through Tauri. Reads what a key types on the active layout, so
# a shortcut letter follows the layout (#196), and posts ⌘V to the app the
# picker was opened from (#27).
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "libc", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "CGWindow"] }
# Already locked through Tauri; numeric window metadata and lifecycle observers.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString"] }
block2 = "0.6.2"
# Already locked through Tauri. Reads whether macOS opened Ibis as a login
# item (#525), so the picker stays hidden then.
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSAppleEventManager", "NSAppleEventDescriptor", "NSData", "NSString", "NSThread", "NSArray", "NSBundle", "NSURL", "objc2-core-services", "NSNotification", "NSDistributedNotificationCenter", "NSOperation", "block2"] }
# Already locked through auto-launch: reads a login item waiting for the
# person's approval, which auto-launch reports only as "off" (#530 review).
smappservice-rs = "0.1.3"

[dev-dependencies]
ibis = { path = "../../../crates/ibis-cli" }
tempfile = "3.27.0"
# A mock app for the offline update check test.
tauri = { version = "2.12", features = ["test"] }

# `forbid` cannot be narrowed by a module allowance. Match the workspace
# policy, with unsafe allowed only in paste/macos/secure_input.rs and safety.rs,
# paste/permission/drag.rs and cfg(test) paste/windows_bstr_test.rs (ADR 0029).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"

# Already locked through Tauri; direct APIs preserve actual application errors.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
window-vibrancy = "=0.8.1"
# Starting Ibis at login (#525): SMAppService on macOS, the current user's Run
# key on Windows. The library the official tauri-plugin-autostart wraps; the
# plugin itself offers no SMAppService. Linux needs no library.
auto-launch = "0.6.0"

[target.'cfg(target_os = "windows")'.dependencies]
# Already locked through the clipboard plugin. Writes plain text, HTML Format
# (with its byte offsets) and RTF in one clipboard opening (#26).
clipboard-win = "5.4.3"
windows = { version = "0.62.2", features = ["Foundation", "System_Power", "System_Profile", "UI_ViewManagement"] }
# Safe Win32 bindings for pasting (#1133): the window in front, its process,
# name and rights, and one SendInput. No raw native calls in Ibis (decision 0029).
winsafe = { version = "0.0.29", features = ["user", "advapi", "version"] }
# Safe UI Automation: whether the focused field takes a password (#1133).
# Its core module needs `input`; `pattern` reads Notepad's text in a test.
uiautomation = { version = "0.25.1", default-features = false, features = ["input", "pattern"] }
