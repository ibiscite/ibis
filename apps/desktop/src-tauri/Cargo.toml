[package]
name = "ibis-desktop"
description = "Ibis desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
ibis-core = { path = "../../../crates/ibis-core", features = ["type-export"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-single-instance = "2.3"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
