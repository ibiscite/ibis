[package]
name = "ibis-desktop"
description = "Ibis desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
ibis-core = { path = "../../../crates/ibis-core", features = ["type-export"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-single-instance = "2.3"

# Already locked through Tauri/global-hotkey. Query X11's actual input owner
# because a passive shortcut grab can leave GTK's active flag stale.
[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6.2"
x11rb = { version = "0.13.2", default-features = false, features = ["xkb"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true

# Already locked through Tauri; direct APIs preserve actual application errors.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
window-vibrancy = "=0.8.1"

# Safe native accessibility queries; no raw native calls in Ibis.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "UI_ViewManagement"] }
