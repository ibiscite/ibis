<!doctype html>
<html lang="en" data-website itemscope itemtype="https://schema.org/WebSite">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta itemprop="name" content="Ibis">
  <title>{{title}} | Ibis</title>
  <meta name="description" content="{{description}}">
  {{robots}}
  <link itemprop="url" rel="canonical" href="https://ibiscite.org{{path}}">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/assets/png/apple-touch-icon.png">
  <link rel="manifest" href="/assets/site.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}} | Ibis">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="https://ibiscite.org{{path}}">
  <meta property="og:image" content="https://ibiscite.org/assets/png/og-image.png">
  <meta property="og:image:alt" content="Ibis. {{headline}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/picker-tokens.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/demo.css">
  <script src="/site.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="site">
<header class="index">
  <div class="index-sticky"><div class="index-content">
  <a class="logo" href="/" aria-label="Ibis home">
    <picture class="logo-light"><source media="(prefers-reduced-motion: reduce)" srcset="/assets/ibis-logo.svg"><img src="/assets/ibis-logo-bird-animated.svg" alt="" width="418" height="200"></picture>
    <picture class="logo-dark"><source media="(prefers-reduced-motion: reduce)" srcset="/assets/ibis-logo-on-dark.svg"><img src="/assets/ibis-logo-bird-animated-on-dark.svg" alt="" width="418" height="200"></picture>
  </a>
  <p class="index-note">Early preview · <a href="https://github.com/ibiscite/ibis/releases">Release notes</a></p>
  <nav aria-label="Site"><ul>{{navigation}}</ul></nav>
  <div class="appearance" hidden>
    <button class="appearance-toggle" type="button" role="switch" aria-label="Dark appearance" aria-checked="false">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4"/></svg>
      <span class="appearance-track" aria-hidden="true"><span class="appearance-thumb"></span></span>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 12.5A7 7 0 0 1 7.5 3.5a7 7 0 1 0 9 9z"/></svg>
    </button>
    <button class="appearance-system" type="button" data-system="System" data-use-system="Use system">Use system</button>
  </div>
  </div></div>
</header>
<main id="main" tabindex="-1" data-page="{{page}}">{{body}}{{next-page}}</main>
<footer class="row"><div class="text">
  <p class="colophon"><span>Ibis is free and open source under the GNU AGPL v3.0 or later.</span>
    <a href="https://github.com/ibiscite/ibis">Source on GitHub</a> <a href="https://github.com/ibiscite/ibis/blob/main/PRIVACY.md">Privacy</a> <a href="https://github.com/ibiscite/ibis/releases">All releases</a></p>
  <div class="appearance" hidden>
    <button class="appearance-toggle" type="button" role="switch" aria-label="Dark appearance" aria-checked="false">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4"/></svg>
      <span class="appearance-track" aria-hidden="true"><span class="appearance-thumb"></span></span>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 12.5A7 7 0 0 1 7.5 3.5a7 7 0 1 0 9 9z"/></svg>
    </button>
    <button class="appearance-system" type="button" data-system="System" data-use-system="Use system">Use system</button>
  </div>
</div></footer>
</div>
</body>
</html>
